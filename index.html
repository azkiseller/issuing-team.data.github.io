    const R = 48, C = 2 * Math.PI * R, GAP = items.length > 1 ? 2 : 0;
    let offset = 0;
    const arcs = items.map((x, i) => {
      const len = (x.count / total) * C;
      const dash = Math.max(len - GAP, 0.5);
      const arc = `<circle class="share-arc" data-i="${i}" r="${R}" cx="60" cy="60" stroke="${x.color}"
        stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}">
        <title>${esc(x.company)}: ${formatNum(x.count)} صدور (${formatNum(Math.round(x.pct))}٪)</title></circle>`;
      offset += len;
      return arc;
    }).join('');

    const pctLabel = (p) => (p > 0 && p < 1 ? '<۱' : formatNum(Math.round(p)));
    return `
      <div class="panel chart share-panel">
        <div class="label">${esc(title)}</div>
        <div class="share-wrap">
          <div class="share-donut">
            <svg viewBox="0 0 120 120" role="img" aria-label="${esc(aria)}">
              <circle class="share-track" r="${R}" cx="60" cy="60"></circle>
              <g transform="rotate(-90 60 60)">${arcs}</g>
            </svg>
            <div class="share-center"><b>${formatNum(total)}</b><small>صدور</small></div>
          </div>
          <table class="share-legend">
            <thead><tr><th>${esc(nameHeader)}</th><th>صدور</th><th>سهم</th></tr></thead>
            <tbody>
              ${items.map((x, i) => `
                <tr data-i="${i}">
                  <td><span class="share-swatch" style="background:${x.color}"></span>${esc(x.company)}</td>
                  <td class="num">${formatNum(x.count)}</td>
                  <td class="num"><b>${pctLabel(x.pct)}٪</b></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  // هاور روی کمان یا ردیف جدول: همان شرکت برجسته می‌شود (یک‌بار، با event delegation)
  let shareHoverBound = false;
  function bindShareDonutHover() {
    if (shareHoverBound) return;
    shareHoverBound = true;
    const set = (panel, i) => {
      panel.classList.toggle('has-hl', i != null);
      panel.querySelectorAll('[data-i]').forEach((el) => el.classList.toggle('hl', el.getAttribute('data-i') === i));
    };
    document.addEventListener('mouseover', (e) => {
      const t = e.target.closest && e.target.closest('.share-panel [data-i]');
      const panel = e.target.closest && e.target.closest('.share-panel');
      if (panel) set(panel, t ? t.getAttribute('data-i') : null);
    });
    document.addEventListener('mouseout', (e) => {
      const panel = e.target.closest && e.target.closest('.share-panel');
      if (panel && !panel.contains(e.relatedTarget)) set(panel, null);
    });
  }

  function renderCompanyDonut(status) {
    if (!status) return '';
    const activeNames = splitCompanies(status.companies);
    const allNames = splitCompanies(status.all_companies);
    const total = allNames.length || activeNames.length;
    if (total === 0) return '';
    const activeCount = activeNames.length;
    const pct = Math.round((activeCount / total) * 100);
    const updated = status.updated_at
      ? new Date(status.updated_at).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })
      : '—';
    return `
      <div class="panel chart donut-panel">
        <div class="label">شرکت‌های فعال از کل شرکت‌های همکاری‌شده</div>
        <div class="donut-wrap">
          <div class="donut" style="--pct:${pct}" role="img" aria-label="${pct} درصد فعال">
            <div class="donut-hole"><b>${formatNum(pct)}٪</b><small>${formatNum(activeCount)} از ${formatNum(total)}</small></div>
          </div>
          <div class="donut-info">
            <div class="updated">آخرین به‌روزرسانی: ${esc(updated)}</div>
            <div class="names">${activeNames.length ? activeNames.map(esc).join('،  ') : 'در حال حاضر فعال نیست'}</div>
          </div>
        </div>
      </div>
    `;
  }

  // نمودار خطی صدور روزانه در دوره‌ی جاری — زمان از چپ (قدیمی) به راست (جدید).
  // خط و سطح با SVG کشیده می‌شن و تمام عرض رو پر می‌کنن؛ نقطه‌ها، خط راهنما و
  // تولتیپ HTML هستن تا با کش اومدن SVG بیضی نشن.
  const TREND_H = 100; // ارتفاع مختصات داخلی SVG

  function trendY(v, max) { return TREND_H - (v / max) * TREND_H; }

  // نمودار ۲۴ ساعته‌ی میانگین کاربران فعال (سرپرست)
  const HOURLY_DAYS = 30;
  // ۹۶ خانه‌ی ربع‌ساعتی از ۰۰:۰۰ تا ۲۳:۴۵ (slot = ساعت × ۴ + ربع)
  function hourlySeries(rows) {
    const bySlot = {};
    (rows || []).forEach((r) => { bySlot[r.slot] = r; });
    return Array.from({ length: 96 }, (_, sl) => {
      const r = bySlot[sl];
      const hh = `${String(Math.floor(sl / 4)).padStart(2, '0')}:${String((sl % 4) * 15).padStart(2, '0')}`;
      return {
        target_count: r ? Number(r.avg_active) : 0,
        report_date_jalali: `ساعت ${hh}`,
        empty: !r,
        note: r ? [`میانگین ${formatNum(r.days)} روز`, r.today != null ? `امروز: ${formatNum(Number(r.today))}` : ''].filter(Boolean).join(' · ') : '',
      };
    });
  }
  function renderHourlyActive(rows) {
    const title = 'میانگین کاربران فعال در ساعات روز';
    if (!rows.length) {
      return `<div class="panel chart trend"><div class="trend-head"><div class="label">${title}</div></div>
        <div class="empty-state">داده از هر ۱۵ دقیقه جمع‌آوری می‌شود و نمودار از ساعت‌های بعد پر می‌شود.</div></div>`;
    }
    const maxDays = Math.max(...rows.map((r) => Number(r.days) || 0));
    return renderDailyTrendChart(hourlySeries(rows), 'hourly', title, {
      aria: 'میانگین کاربران فعال در هر ربع ساعت؛ با کلیدهای جهت‌نما بین زمان‌ها جابه‌جا شوید',
      axis: ['۰۰:۰۰', '۰۶:۰۰', '۱۲:۰۰', '۱۸:۰۰', '۲۳:۴۵'],
      dense: true,
      footnote: `هر ربع ساعت، میانگین ${formatNum(maxDays)} روز اخیر (حداکثر ${formatNum(HOURLY_DAYS)} روز). ربع‌ساعت‌های بدون داده خالی می‌مانند.`,
    });
  }

  function renderDailyTrendChart(asc, id = 'trend', title = `روند صدور روزانه در ${CURRENT_PERIOD.label}`, opts = {}) {
    if (!asc || asc.length < 2) return '';
    const values = asc.map((r) => Number(r.target_count) || 0);
    const max = Math.max(...values.filter((_, i) => !asc[i].empty), 1);
    const n = values.length;
    const xs = values.map((_, i) => (i / (n - 1)) * 100);
    // نقطه‌های «بدون داده» (empty) رسم نمی‌شوند: خط و سطح زیرش در آن‌جا قطع می‌شود
    const segments = [];
    let seg = [];
    values.forEach((v, i) => {
      if (asc[i].empty) { if (seg.length) segments.push(seg); seg = []; }
      else seg.push(i);
    });
    if (seg.length) segments.push(seg);
    const pt = (i) => `${xs[i].toFixed(2)},${trendY(values[i], max).toFixed(2)}`;
    const line = segments.map((s) => s.map((i, k) => `${k === 0 ? 'M' : 'L'}${pt(i)}`).join(' ')).join(' ');
    const area = segments.filter((s) => s.length > 1)
      .map((s) => `${s.map((i, k) => `${k === 0 ? 'M' : 'L'}${pt(i)}`).join(' ')} L${xs[s[s.length - 1]].toFixed(2)},${TREND_H} L${xs[s[0]].toFixed(2)},${TREND_H} Z`).join(' ');
    const solo = new Set(segments.filter((s) => s.length === 1).map((s) => s[0])); // نقطه‌ی تنها همیشه دیده شود
    const dots = values.map((v, i) => (asc[i].empty ? '<span class="trend-dot" hidden></span>'
      : `<span class="trend-dot ${solo.has(i) ? 'solo' : ''}" style="left:${xs[i]}%;top:${(trendY(v, max) / TREND_H) * 100}%"></span>`)).join('');
    return `
      <div class="panel chart trend ${opts.dense ? 'dense' : ''}">
        <div class="trend-head">
          <div class="label">${esc(title)}</div>
          <div class="trend-max">بیشترین: ${formatNum(max)}</div>
        </div>
        <div class="trend-plot" id="${id}-plot" tabindex="0" role="img"
             aria-label="${esc(opts.aria || 'نمودار صدور روزانه؛ با کلیدهای جهت‌نما بین روزها جابه‌جا شوید')}">
          <svg viewBox="0 0 100 ${TREND_H}" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="${id}-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" class="trend-fill-top" />
                <stop offset="100%" class="trend-fill-bottom" />
              </linearGradient>
            </defs>
            <line x1="0" y1="${TREND_H / 2}" x2="100" y2="${TREND_H / 2}" class="trend-grid" />
            <path d="${area}" fill="url(#${id}-fill)" />
            <path d="${line}" class="trend-line" />
          </svg>
          ${dots}
          <div class="trend-tip" id="${id}-tip" hidden><b></b><span></span></div>
        </div>
        <div class="trend-axis">${(opts.axis || [asc[0].report_date_jalali, asc[n - 1].report_date_jalali]).map((t) => `<span>${esc(faDigits(t))}</span>`).join('')}</div>
        ${opts.footnote ? `<div class="trend-foot">${esc(opts.footnote)}</div>` : ''}
      </div>
    `;
  }

  // لایه‌ی تعاملی: نزدیک‌ترین روز به نشانگر ماوس/انگشت (یا کلیدهای جهت‌نما) انتخاب می‌شه
  function bindTrendChart(asc, id = 'trend', opts = {}) {
    const unit = opts.unit || 'صدور';
    const plot = $(`${id}-plot`);
    if (!plot) return;
    const values = asc.map((r) => Number(r.target_count) || 0);
    const max = Math.max(...values.filter((_, i) => !asc[i].empty), 1);
    const n = values.length;
    const tip = $(`${id}-tip`);
    const dots = plot.querySelectorAll('.trend-dot');
    let current = -1;

    function show(i) {
      current = i;
      const x = (i / (n - 1)) * 100;
      dots.forEach((d, k) => d.classList.toggle('active', k === i));
      tip.hidden = false;
      tip.querySelector('b').textContent = asc[i].empty ? 'بدون داده' : `${formatNum(values[i])} ${unit}`;
      tip.querySelector('span').textContent = faDigits(asc[i].report_date_jalali) + (asc[i].note ? ` · ${asc[i].note}` : '');
      // تولتیپ داخل کادر بمونه: نزدیک لبه‌ها به سمت داخل می‌چسبه
      tip.style.left = `${x}%`;
      const topPct = asc[i].empty ? 70 : (trendY(values[i], max) / TREND_H) * 100;
      tip.style.top = `${topPct}%`;
      tip.classList.toggle('below', topPct < 40); // نقطه‌های بالای نمودار: تولتیپ زیر نقطه
      tip.classList.toggle('edge-left', x < 12);
      tip.classList.toggle('edge-right', x > 88);
    }
    function hide() {
      current = -1;
      tip.hidden = true;
      dots.forEach((d) => d.classList.remove('active'));
    }
    function indexAt(clientX) {
      const r = plot.getBoundingClientRect();
      const ratio = Math.min(Math.max((clientX - r.left) / r.width, 0), 1);
      return Math.round(ratio * (n - 1));
    }

    plot.addEventListener('pointermove', (e) => show(indexAt(e.clientX)));
    plot.addEventListener('pointerdown', (e) => show(indexAt(e.clientX)));
    plot.addEventListener('pointerleave', hide);
    plot.addEventListener('blur', hide);
    plot.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(Math.max((current < 0 ? n : current) - 1, 0)); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); show(Math.min(current + 1, n - 1)); }
      else if (e.key === 'Escape') hide();
    });
  }

  // پنل بات: صدور دوره، صدور امروز، حقوقی که صرفه‌جویی شده، و نمودار روزانه (روزهای بی‌کار = ۰)
  function renderBotPanel(rows) {
    const total = rows.reduce((s, r) => s + (Number(r.target_count) || 0), 0);
    const saved = rows.reduce((s, r) => s + (Number(r.daily_salary) || 0), 0);
    const today = rows
      .filter((r) => Number(r.report_date_sort) === TODAY_SORT)
      .reduce((s, r) => s + (Number(r.target_count) || 0), 0);
    // بسته: کارت جمع‌وجور؛ با کلیک به اندازه‌ی کامل باز می‌شود و نمودار روزانه نمایان می‌شود
    return `
      <section class="bot-panel ${state.botOpen ? 'open' : ''}" aria-label="${esc(BOT_NAME)}">
        <div class="bot-toggle" id="bot-toggle" role="button" tabindex="0" aria-expanded="${!!state.botOpen}" aria-controls="bot-drawer">
          <div class="bot-head">
            <span class="bot-icon" aria-hidden="true">🤖</span><h2>${esc(BOT_NAME)}</h2>
            <span class="bot-more" aria-hidden="true">نمودار روزانه <span class="bot-chevron">▾</span></span>
          </div>
          <div class="bot-stats">
            <div class="bot-stat"><div class="label">صدور ${esc(CURRENT_PERIOD.label)}</div><div class="value">${formatNum(total)}</div></div>
            <div class="bot-stat"><div class="label">صدور امروز</div><div class="value">${formatNum(today)}</div></div>
            <div class="bot-stat saved"><div class="label">صرفه‌جویی<span class="long"> در حقوق</span> <span class="unit">(ریال)</span></div><div class="value">${formatNum(saved)}</div></div>
          </div>
        </div>
        <div class="bot-drawer" id="bot-drawer"><div class="bot-drawer-inner">
          ${renderDailyTrendChart(dailySeries(rows), 'bot', `صدور روزانه‌ی بات در ${CURRENT_PERIOD.label}`)}
        </div></div>
      </section>
    `;
  }
  function bindBotPanel() {
    const t = $('bot-toggle');
    if (!t) return;
    const flip = () => {
      state.botOpen = !state.botOpen;
      t.closest('.bot-panel').classList.toggle('open', state.botOpen);
      t.setAttribute('aria-expanded', String(state.botOpen));
    };
    t.addEventListener('click', flip);
    t.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  }

  // ---------------------------------------------------------------
  // نمای مدیریتی (سرگروه / سرپرست / مدیر)
  // ---------------------------------------------------------------
  // ---------------------------------------------------------------
  // تب «شاخص‌های عملکرد» (فقط سرگروه)
  // ---------------------------------------------------------------
  // هر شاخص ۲۰٪ از سقف ۱۳۵ میلیون ریال. امتیاز = MAX(0, MIN(1, (بدترین − X) / (بدترین − بهترین)))
  // (برای شاخص‌هایی که «بیشتر بهتر» است، بدترین < بهترین و همین فرمول درست کار می‌کند)
  const KPI_BASE_PAY = 135000000;
  const KPI_WEIGHT = 0.2;
  const KPI_DEFS = [
    { key: 'oct', title: 'OCT', desc: 'میانگین زمان صدور سفارش', unit: 'min', worst: 234, best: 180 },
    { key: 'bug_rate', title: 'Issuing Bug Rate', desc: 'نرخ باگ صدور', unit: 'pct', worst: 0.6, best: 0.4, digits: 2 },
    { key: 'under_1h', title: 'Issuing Under 1h', desc: 'درصد صدورهای زیر یک ساعت', unit: 'pct', worst: 65, best: 75 },
    { key: 'avg_oct_agent', title: 'AVG OCT Per Agent', desc: 'میانگین OCT اپراتورهای تیم شما', unit: 'min', worst: null, best: null },
    { key: 'same_shift', title: 'Same Shift Issued', desc: 'سفارش‌های ثبت‌شده در شیفت که در همان شیفت صادر شده‌اند', unit: 'pct', worst: null, best: null },
  ];
  const KPI_SCOPE_ORDER = ['team_lead', 'pair', 'shift', 'all'];
  const KPI_SCOPE_LABEL = { team_lead: 'فردی', pair: 'مشترک با سرگروه پارتنر', all: 'کل واحد' };
  const SHIFT_LABEL = { morning: 'شیفت صبح (۸ تا ۱۶)', evening: 'شیفت عصر (۱۶ تا ۲۴)' };

  function kpiScore(def, x) {
    if (def.worst == null || def.best == null || x == null) return null;
    return Math.max(0, Math.min(1, (def.worst - x) / (def.worst - def.best)));
  }
  function kpiValueLabel(def, x) {
    const n = Number(x);
    if (def.unit === 'min') {
      const h = Math.floor(n / 60), m = Math.round(n % 60);
      return `${formatNum(Math.round(n))} <small>دقیقه</small><span class="kpi-sub">${faDigits(`${h}:${String(m).padStart(2, '0')}`)} ساعت</span>`;
    }
    const d = def.digits != null ? def.digits : 1;
    const txt = n.toFixed(d).replace(/\.?0+$/, '').replace('.', '٫');
    return `${faDigits(txt)}<small>٪</small>`;
  }
  function kpiBoundLabel(def, v) {
    return def.unit === 'min' ? `${formatNum(v)} دقیقه` : `${faDigits(String(v).replace('.', '٫'))}٪`;
  }
  function renderViewTabs() {
    return `
      <div class="view-tabs" role="tablist">
        <button type="button" role="tab" data-tab="team" aria-selected="${state.activeTab !== 'kpi'}">تیم من</button>
        <button type="button" role="tab" data-tab="kpi" aria-selected="${state.activeTab === 'kpi'}">شاخص‌های عملکرد</button>
      </div>`;
  }
  function bindViewTabs() {
    document.querySelectorAll('.view-tabs [data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.getAttribute('data-tab');
        document.querySelectorAll('.view-tabs [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
        $('tab-team').hidden = state.activeTab === 'kpi';
        $('tab-kpi').hidden = state.activeTab !== 'kpi';
      });
    });
  }
  function renderKpiTab(rows) {
    // برای هر شاخص، دقیق‌ترین دامنه‌ی موجود: فردی ← جفت ← شیفت ← کل
    const pick = {};
    rows.forEach((r) => {
      const cur = pick[r.kpi];
      if (!cur || KPI_SCOPE_ORDER.indexOf(r.scope_type) < KPI_SCOPE_ORDER.indexOf(cur.scope_type)) pick[r.kpi] = r;
    });
    const maxPay = KPI_BASE_PAY * KPI_WEIGHT;
    let total = 0, pending = 0;
    const cards = KPI_DEFS.map((def) => {
      const r = pick[def.key];
      const x = r ? Number(r.value) : null;
      const score = kpiScore(def, x);
      const pay = score == null ? null : Math.round(score * maxPay);
      if (pay != null) total += pay; else pending += 1;
      const scope = r ? (r.scope_type === 'shift' ? (SHIFT_LABEL[r.scope_key] || 'شیفت') : KPI_SCOPE_LABEL[r.scope_type]) : '';
      const meter = (score != null) ? `
        <div class="kpi-meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(score * 100)}" aria-label="امتیاز ${def.title}">
          <div class="kpi-meter-fill" style="width:${(score * 100).toFixed(1)}%"></div>
        </div>
        <div class="kpi-bounds"><span>${kpiBoundLabel(def, def.worst)} · صفر</span><span>${kpiBoundLabel(def, def.best)} · سقف</span></div>` : '';
      const payHtml = !r ? '<div class="kpi-pay muted">هنوز داده‌ای ثبت نشده</div>'
        : pay == null ? '<div class="kpi-pay muted">فرمول حقوق این شاخص هنوز تعیین نشده</div>'
        : `<div class="kpi-pay"><b>${formatNum(pay)}</b> <span>از ${formatNum(maxPay)} ریال</span><em>${formatNum(Math.round(score * 100))}٪</em></div>`;
      return `
        <div class="panel kpi-card ${r ? '' : 'empty'}">
          <div class="kpi-head">
            <div><div class="kpi-title" dir="ltr">${esc(def.title)}</div><div class="kpi-desc">${esc(def.desc)}</div></div>
            ${scope ? `<span class="kpi-scope">${esc(scope)}</span>` : ''}
          </div>
          <div class="kpi-value">${r ? kpiValueLabel(def, x) : '—'}</div>
          ${meter}
          ${payHtml}
        </div>`;
    }).join('');
    const updated = rows.reduce((m, r) => (r.updated_at > m ? r.updated_at : m), '');
    return `
      <div class="panel kpi-total">
        <div>
          <div class="label">جمع حقوق شاخص‌های عملکرد (${esc(CURRENT_PERIOD.label)})</div>
          <div class="kpi-total-value"><b>${formatNum(total)}</b> <span>از ${formatNum(KPI_BASE_PAY)} ریال</span></div>
          ${pending ? `<div class="kpi-note">${formatNum(pending)} شاخص هنوز در جمع حساب نشده است.</div>` : ''}
        </div>
        <div class="kpi-updated">${updated ? `آخرین به‌روزرسانی: ${esc(new Date(updated).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' }))}` : ''}</div>
      </div>
      <div class="kpi-grid">${cards}</div>`;
  }

  async function renderManagerialView(profile, { silent = false } = {}) {
    const content = $('content-area');
    if (!silent) content.innerHTML = '<div class="loading">در حال بارگذاری ساختار تیم...</div>';

    // هر سه کوئری توسط RLS به «خود کاربر + زیرمجموعه‌اش» محدود می‌شن
    const [profilesRes, targetsRes, statusRes, companyRes, scopeRes, partnerRes, hourlyRes, kpiRes] = await Promise.all([
      sb.from('profiles').select('id, full_name, role, reports_to, unit'),
      sb.from('daily_targets')
        .select('operator_id, report_date_jalali, report_date_sort, target_count, daily_salary')
        .gte('report_date_sort', CURRENT_PERIOD.startSort)
        .lte('report_date_sort', CURRENT_PERIOD.endSort)
        .order('report_date_sort', { ascending: false })
        .limit(10000),
      sb.from('issuer_active_status').select('operator_id, is_active, is_active_to_issue, status, companies, all_companies, updated_at'),
      // آمار شرکت‌ها: RLS خودش تعیین می‌کنه چه شرکت‌هایی دیده بشه
      sb.from('company_active_status').select('company, active_count').order('active_count', { ascending: false }),
      // شرکت‌های گروه هر سرگروه (RLS: سرگروه فقط گروه خودش، سرپرست/مدیر همه)
      sb.from('team_lead_company_scope').select('profile_id, company, sort_order').order('sort_order'),
      // سرگروه‌های پارتنر (RLS: سرگروه فقط ردیف خودش، سرپرست/مدیر همه؛ تیم پارتنر جزو زیرمجموعه‌ی سرگروه برمی‌گردد)
      profile.role === 'operator'
        ? Promise.resolve({ data: [] })
        : sb.from('team_lead_partners').select('profile_id, partner_id'),
      // میانگین کاربران فعال در هر ساعت روز (فقط سرپرست/مدیر؛ از عکس‌های ۱۵ دقیقه‌ای، ۳۰ روز اخیر)
      SUPERVISOR_ROLES.includes(profile.role)
        ? sb.rpc('active_hourly_profile', { p_days: HOURLY_DAYS })
        : Promise.resolve({ data: null }),
      // شاخص‌های عملکرد دوره‌ی جاری (RLS: سرگروه فقط فردی/جفت/شیفت/کل خودش)
      profile.role === 'team_lead'
        ? sb.from('kpi_values').select('kpi, scope_type, scope_key, value, sample_size, updated_at').eq('period_start_sort', CURRENT_PERIOD.startSort)
        : Promise.resolve({ data: [] }),
    ]);

    if (profilesRes.error || targetsRes.error) {
      content.innerHTML = '<div class="empty-state">خطا در دریافت اطلاعات. صفحه را دوباره بارگذاری کنید.</div>';
      return;
    }

    // --- بات جدا می‌شه: نه در درخت، نه در جمع‌ها و تعداد نفرات
    const bot = (profilesRes.data || []).find((p) => (p.full_name || '').trim() === BOT_NAME) || null;
    const botRows = bot ? (targetsRes.data || []).filter((r) => r.operator_id === bot.id) : [];

    // --- ساختار درخت
    state.visibleProfiles = (profilesRes.data || []).filter((p) => !bot || p.id !== bot.id);
    state.profileById = {};
    state.childrenOf = {};
    state.visibleProfiles.forEach((p) => {
      state.profileById[p.id] = p;
      if (p.reports_to) (state.childrenOf[p.reports_to] = state.childrenOf[p.reports_to] || []).push(p.id);
    });

    // --- تیم‌بندی: هر دو سرگروه پارتنر زیر یک نود «تیم X و Y»
    const partnerOf = {};
    (partnerRes.data || []).forEach((r) => { partnerOf[r.profile_id] = r.partner_id; });
    function makePair(aId, bId) {
      const id = PAIR_PREFIX + aId;
      const a = state.profileById[aId], b = state.profileById[bId];
      state.profileById[id] = { id, full_name: `تیم ${a.full_name || ''} و ${b.full_name || ''}`, role: 'team_pair' };
      state.childrenOf[id] = [aId, bId];
      return id;
    }
    // سرگروهِ دارای پارتنر: ریشه‌ی درخت خودِ نود «تیم من و پارتنرم» است
    const partner = profile.role === 'team_lead' && partnerOf[profile.id] ? state.profileById[partnerOf[profile.id]] : null;
    let summaryId = profile.id;
    if (partner) {
      summaryId = makePair(profile.id, partner.id);
      state.childrenOf[TREE_ROOT_ID] = [summaryId];
      state.treeRootId = TREE_ROOT_ID;
    } else {
      state.treeRootId = profile.id;
      // منیجر (یا ارشدی که زیرمجموعه‌ی مستقیم ندارد): ریشه = افراد بالای درخت ازکی سلر
      if (SEES_ALL_ROLES.includes(profile.role) && !(state.childrenOf[profile.id] || []).length) {
        state.childrenOf[TREE_ROOT_ID] = state.visibleProfiles
          .filter((p) => p.id !== profile.id && p.unit !== 'center' && p.role !== 'operator'
            && (!p.reports_to || !state.profileById[p.reports_to]))
          .map((p) => p.id);
        state.treeRootId = TREE_ROOT_ID;
        summaryId = TREE_ROOT_ID;
      }
      // سرپرست/مدیر: سرگروه‌های پارتنری که زیر یک نفرند، جای خودشان یک نود تیم می‌گیرند
      Object.keys(state.childrenOf).forEach((parentId) => {
        const kids = state.childrenOf[parentId];
        const used = new Set();
        const grouped = [];
        kids.forEach((id) => {
          if (used.has(id)) return;
          const pid = partnerOf[id];
          const p = state.profileById[id];
          if (p && p.role === 'team_lead' && pid && pid !== id && kids.includes(pid) && !used.has(pid)) {
            used.add(id); used.add(pid);
            grouped.push(makePair(id, pid));
          } else {
            grouped.push(id);
          }
        });
        // تیم‌ها اول، بعد بقیه
        state.childrenOf[parentId] = grouped.filter(isVirtualId).concat(grouped.filter((id) => !isVirtualId(id)));
      });
    }
    // فقط افرادِ داخل درخت (مدیرِ خودِ کاربر که RLS برمی‌گرداند شمرده و جستجو نمی‌شود)
    state.treeIds = new Set();
    (function collect(id) {
      (state.childrenOf[id] || []).forEach((cid) => { if (!state.treeIds.has(cid)) { state.treeIds.add(cid); collect(cid); } });
    })(summaryId);

    // --- شرکت‌های گروه، به‌تفکیک سرگروه
    state.scopeByLead = {};
    (scopeRes.data || []).forEach((r) => {
      const c = (r.company || '').trim();
      if (c) (state.scopeByLead[r.profile_id] = state.scopeByLead[r.profile_id] || []).push(c);
    });

    // --- وضعیت فعال/غیرفعال
    state.statusByOperator = {};
    (statusRes.data || []).forEach((r) => { if (!bot || r.operator_id !== bot.id) state.statusByOperator[r.operator_id] = r; });

    // --- عملکرد و حقوق
    state.targetsByOperator = {};
    state.rawTargetsByOperator = {};
    (targetsRes.data || []).forEach((r) => {
      if (bot && r.operator_id === bot.id) return;
      const b = (state.targetsByOperator[r.operator_id] = state.targetsByOperator[r.operator_id] || { total: 0, totalSalary: 0, count: 0, lastDate: null, lastDateSort: 0, todayCount: 0 });
      const sortNum = Number(r.report_date_sort) || 0;
      b.total += Number(r.target_count) || 0;
      b.totalSalary += Number(r.daily_salary) || 0;
      b.count += 1;
      if (sortNum > b.lastDateSort) { b.lastDate = r.report_date_jalali; b.lastDateSort = sortNum; }
      if (sortNum === TODAY_SORT) b.todayCount += Number(r.target_count) || 0;
      (state.rawTargetsByOperator[r.operator_id] = state.rawTargetsByOperator[r.operator_id] || []).push(r);
    });

    computeAggregates();

    // در حالت دو تیم، خودِ دو سرگروه جزو «زیرمجموعه» شمرده نمی‌شوند
    const totalTeam = [...state.treeIds].filter((id) => !isVirtualId(id) && !(partner && (id === profile.id || id === partner.id))).length;
    const grandTotal = state.subtreeTotal[summaryId] || 0;
    const grandTotalSalary = state.subtreeSalary[summaryId] || 0;
    const myActive = state.activeCountBySubtree[summaryId] || 0;

    // سرپرست/مدیر: کلیک روی کارت «کاربران فعال» نمودار ۲۴ ساعته را زیر ردیف کارت‌ها باز می‌کند
    const hasHourly = !!(hourlyRes && hourlyRes.data);
    $('summary-row').innerHTML = `
      <div class="summary-card"><div class="label">جمع کل حقوق تیم <span class="unit">(ریال)</span></div><div class="value salary">${formatNum(grandTotalSalary)}</div></div>
      <div class="summary-card"><div class="label">جمع کل عملکرد تیم</div><div class="value">${formatNum(grandTotal)}</div></div>
      <div class="summary-card ${hasHourly ? 'expandable' : ''} ${hasHourly && state.hourlyOpen ? 'open' : ''}" ${hasHourly
        ? `id="active-card" role="button" tabindex="0" aria-expanded="${!!state.hourlyOpen}" aria-controls="hourly-drawer" title="نمایش میانگین کاربران فعال در ساعات روز"`
        : ''}>
        <div class="label">کاربران فعال زیرمجموعه</div>
        <div class="value"><span class="pulse-dot"></span>${formatNum(myActive)}${profile.role === 'team_lead' ? ` <small>از ${formatNum(totalTeam)}</small>` : ''}</div>
        ${hasHourly ? '<div class="card-hint"><span class="card-chevron">▾</span> نمودار ساعتی</div>' : ''}
      </div>
      <div class="summary-card"><div class="label">کل زیرمجموعه</div><div class="value">${formatNum(totalTeam)}</div></div>
    `;

    // --- ردیف آمار شرکت‌ها
    let companyStatsHtml = '';
    const companyStats = companyRes.data || [];
    const myScope = state.scopeByLead[profile.id] || [];
    if (profile.role === 'team_lead' && myScope.length) {
      // ترتیب و لیست شرکت‌ها از جدول team_lead_company_scope؛ شرکت بدون آمار = ۰
      const countBy = {};
      companyStats.forEach((c) => { countBy[c.company] = c.active_count; });
      companyStatsHtml = companyPillsHtml(myScope.map((c) => ({ company: c, active_count: countBy[c] || 0 })));
    } else if (companyStats.length && Object.keys(state.scopeByLead).length) {
      companyStatsHtml = renderCompanyGroups(companyStats); // سرپرست/مدیر: گروه‌بندی بر اساس گروه‌های شرکتی سرگروه‌ها
    } else if (companyStats.length) {
      companyStatsHtml = companyPillsHtml(companyStats);
    }

    // --- گزینه‌های فیلتر شرکت
    const companyOptions = Array.from(new Set(
      state.visibleProfiles
        .map((p) => state.statusByOperator[p.id])
        .filter(Boolean)
        .flatMap((st) => splitCompanies(st.all_companies || st.companies))
    )).sort((a, b) => a.localeCompare(b, 'fa'));

    const kpiRows = (kpiRes && kpiRes.data) || [];
    const showKpiTab = profile.role === 'team_lead' && kpiRows.length > 0;
    content.innerHTML = (hasHourly ? `
      <div class="hourly-drawer ${state.hourlyOpen ? 'open' : ''}" id="hourly-drawer">
        <div class="hourly-drawer-inner">${renderHourlyActive(hourlyRes.data)}</div>
      </div>` : '') + (showKpiTab ? renderViewTabs() : '') + `
      <div id="tab-team" ${showKpiTab && state.activeTab === 'kpi' ? 'hidden' : ''}>
      ${bot ? renderBotPanel(botRows) : ''}
      ${companyStatsHtml}
      <div class="filters">
        <input type="search" class="tree-search" id="tree-search" placeholder="جستجوی نام..." aria-label="جستجوی نام">
        ${companyOptions.length ? `
          <select id="company-filter" class="tree-search" aria-label="فیلتر شرکت">
            <option value="">همه‌ی شرکت‌ها</option>
            ${companyOptions.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
          </select>` : ''}
      </div>
      <div class="section-label">ساختار زیرمجموعه</div>
      <div id="tree-root"></div>
      </div>
      ${showKpiTab ? `<div id="tab-kpi" ${state.activeTab === 'kpi' ? '' : 'hidden'}>${renderKpiTab(kpiRows)}</div>` : ''}
    `;
    if (showKpiTab) bindViewTabs();

    renderTree(state.treeRootId);
    if (bot) { bindTrendChart(dailySeries(botRows), 'bot'); bindBotPanel(); }
    bindCompanyGroups();
    if (hasHourly) {
      if (hourlyRes.data.length) bindTrendChart(hourlySeries(hourlyRes.data), 'hourly', { unit: 'کاربر فعال' });
      const card = $('active-card');
      const drawer = $('hourly-drawer');
      const flipHourly = () => {
        state.hourlyOpen = !state.hourlyOpen;
        drawer.classList.toggle('open', state.hourlyOpen);
        card.classList.toggle('open', state.hourlyOpen);
        card.setAttribute('aria-expanded', String(state.hourlyOpen));
      };
      card.addEventListener('click', flipHourly);
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipHourly(); } });
    }

    $('tree-search').addEventListener('input', (e) => {
      state.search = e.target.value.trim();
      updateTreeFilter();
    });
    const cf = $('company-filter');
    if (cf) cf.addEventListener('change', (e) => { state.companyFilter = e.target.value; updateTreeFilter(); });
  }

  // شرکت‌ها به تفکیک گروه‌های شرکتی (هر جفت سرگروه یک گروه)، با نام «گروه ۱، ۲، ...».
  // شماره‌ی گروه ثابت است (بر اساس مجموعه‌ی شرکت‌ها، نه تعداد فعال) تا با هر به‌روزرسانی جابه‌جا نشود.
  // شرکت‌هایی که در هیچ گروهی نیستند نمایش داده نمی‌شوند.
  function companyGroups(companyStats) {
    const countBy = {};
    companyStats.forEach((c) => { countBy[(c.company || '').trim()] = Number(c.active_count) || 0; });
    const groups = {};
    Object.entries(state.scopeByLead).forEach(([leadId, companies]) => {
      const key = companies.slice().sort().join('|');
      groups[key] = groups[key] || { key, companies };
    });
    return Object.values(groups).sort((a, b) => a.key.localeCompare(b.key, 'fa')).map((g, i) => {
      const items = g.companies.map((c) => ({ company: c, active_count: countBy[c] || 0 }))
        .sort((a, b) => b.active_count - a.active_count);
      return { label: `گروه ${formatNum(i + 1)}`, items, total: items.reduce((s, x) => s + x.active_count, 0) };
    });
  }
  function renderCompanyGroups(companyStats) {
    const groups = companyGroups(companyStats);
    if (!groups.length) return '';
    return `
      <section class="company-groups ${state.companiesOpen ? 'open' : ''}">
        <div class="cg-toggle" id="cg-toggle" role="button" tabindex="0" aria-expanded="${!!state.companiesOpen}">
          <span class="cg-title">کاربران فعال در هر شرکت</span>
          <span class="cg-more">جزئیات <span class="cg-chevron">▾</span></span>
        </div>
        <div class="cg-drawer"><div class="cg-drawer-inner">
          ${groups.map((g) => `
            <div class="cg-row">
              <div class="cg-row-head"><span>${esc(g.label)}</span><b>${formatNum(g.total)} فعال</b></div>
              <div class="cg-chips">
                ${g.items.map((c) => `<span class="cg-chip ${c.active_count ? '' : 'zero'}"><span class="pulse-dot sm"></span>${esc(c.company)}<b>${formatNum(c.active_count)}</b></span>`).join('')}
              </div>
            </div>`).join('')}
        </div></div>
      </section>`;
  }
  function bindCompanyGroups() {
    const t = $('cg-toggle');
    if (!t) return;
    const flip = () => {
      state.companiesOpen = !state.companiesOpen;
      t.closest('.company-groups').classList.toggle('open', state.companiesOpen);
      t.setAttribute('aria-expanded', String(state.companiesOpen));
    };
    t.addEventListener('click', flip);
    t.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
  }

  function companyPillsHtml(list) {
    return `
      <div class="company-stats-row">
        ${list.map((c) => `
          <div class="company-pill" title="${esc(c.company)}">
            <span class="pulse-dot sm"></span><span class="company-name">${esc(c.company)}</span><b>${formatNum(c.active_count)}</b>
          </div>`).join('')}
      </div>
    `;
  }

  // جمع عملکرد، حقوق و تعداد فعال برای هر زیردرخت (یک‌بار محاسبه)
  function computeAggregates() {
    const tot = {}, sal = {}, act = {};
    const visiting = new Set();
    function walk(id) {
      if (tot[id] !== undefined) return;
      if (visiting.has(id)) { tot[id] = 0; sal[id] = 0; act[id] = 0; return; } // محافظ حلقه
      visiting.add(id);
      const own = state.targetsByOperator[id];
      let t = own ? own.total : 0;
      let s = own ? own.totalSalary : 0;
      let a = isFullyActive(state.statusByOperator[id]) ? 1 : 0;
      (state.childrenOf[id] || []).forEach((cid) => { walk(cid); t += tot[cid]; s += sal[cid]; a += act[cid]; });
      tot[id] = t; sal[id] = s; act[id] = a;
      visiting.delete(id);
    }
    Object.keys(state.profileById).forEach(walk);
    if (state.childrenOf[TREE_ROOT_ID]) walk(TREE_ROOT_ID); // ریشه‌ی مجازی (سرگروهِ دارای پارتنر یا منیجر)
    state.subtreeTotal = tot;
    state.subtreeSalary = sal;
    state.activeCountBySubtree = act;
  }

  function updateTreeFilter() {
    const root = $('tree-root');
    if (!state.search && !state.companyFilter) { renderTree(state.treeRootId); return; }
    const q = state.search.toLowerCase();
    let matches = state.visibleProfiles.filter((p) => p.id !== state.profile.id && state.treeIds.has(p.id));
    if (q) matches = matches.filter((p) => (p.full_name || '').toLowerCase().includes(q));
    if (state.companyFilter) {
      matches = matches.filter((p) => {
        const st = state.statusByOperator[p.id];
        return st && splitCompanies(st.all_companies || st.companies).includes(state.companyFilter);
      });
    }
    if (matches.length === 0) {
      root.innerHTML = '<div class="empty-state">کسی با این مشخصات پیدا نشد</div>';
      return;
    }
    root.innerHTML = sortKidsForDisplay(matches.map((p) => p.id)).map((id, i) => buildNodeHtml(id, i)).join('');
  }

  // اپراتورها: بیشترین صدور امروز بالاتر؛ بعد آنلاین‌ها؛ بعد الفبایی. نودهای غیربرگ دست‌نخورده
  const todayOf = (id) => (state.targetsByOperator[id] && state.targetsByOperator[id].todayCount) || 0;
  function sortKidsForDisplay(ids) {
    return ids.slice().sort((a, b) => {
      const aLeaf = !(state.childrenOf[a] || []).length;
      const bLeaf = !(state.childrenOf[b] || []).length;
      if (!aLeaf || !bLeaf) return 0;
      const tA = todayOf(a), tB = todayOf(b);
      if (tA !== tB) return tB - tA;
      const onA = isFullyActive(state.statusByOperator[a]);
      const onB = isFullyActive(state.statusByOperator[b]);
      if (onA !== onB) return onA ? -1 : 1;
      const nA = (state.profileById[a] && state.profileById[a].full_name) || '';
      const nB = (state.profileById[b] && state.profileById[b].full_name) || '';
      return nA.localeCompare(nB, 'fa');
    });
  }

  function renderTree(rootId) {
    const container = $('tree-root');
    const kids = sortKidsForDisplay(state.childrenOf[rootId] || []);
    container.innerHTML = kids.length
      ? kids.map((id, i) => buildNodeHtml(id, i)).join('')
      : '<div class="empty-state">زیرمجموعه‌ای ثبت نشده است</div>';
  }

  function buildNodeHtml(id, idx) {
    const p = state.profileById[id];
    const kids = state.childrenOf[id] || [];
    const isLeaf = kids.length === 0;
    const own = state.targetsByOperator[id];
    const st = state.statusByOperator[id];
    const active = isFullyActive(st);

    const totalLabel = isLeaf ? (own ? formatNum(own.total) : '—') : formatNum(state.subtreeTotal[id]);
    const salaryLabel = isLeaf ? (own ? formatNum(own.totalSalary) : '—') : formatNum(state.subtreeSalary[id]);
    const countLabel = isLeaf ? (own ? `${formatNum(own.count)} روز` : 'بدون رکورد')
      : p.role === 'team_pair' ? `${formatNum(kids.length)} تیم` : `${formatNum(kids.length)} زیرمجموعه`;

    // نقطه‌ی وضعیت فقط برای خودِ اپراتورها؛ سرگروهِ بدون زیرمجموعه هم فلش می‌گیره
    const lead = (isLeaf && p.role === 'operator')
      ? `<span class="leaf-dot"></span><span class="status-dot ${active ? '' : 'inactive'}" title="${active ? 'فعال' : 'غیرفعال'}"></span>`
      : '<span class="chevron">◀</span>';

    const activeBadge = (!isLeaf && (p.role === 'team_lead' || p.role === 'team_pair'))
      ? `<span class="active-badge"><span class="status-dot"></span>${formatNum(state.activeCountBySubtree[id])} فعال</span>`
      : '';

    const companiesBadge = isLeaf ? operatorCompanyChips(p, st) : '';

    const showToday = isLeaf && own && (state.viewerRole === 'team_lead' || state.viewerRole === 'supervisor');
    const todayBadge = showToday
      ? `<span class="today-count-badge" title="تعداد صدور دقیقاً برای تاریخ امروز">تعداد صدور امروز: <b>${formatNum(own.todayCount)}</b></span>`
      : '';
    const lastBadge = (showToday && own.lastDate)
      ? `<span class="last-active-badge" title="آخرین روزی که این کاربر فعالیت داشته">آخرین روز فعالیت: ${esc(faDigits(own.lastDate))}</span>`
      : '';

    return `
      <div class="tree-node" style="--i:${idx || 0}">
        <div class="tree-row ${isLeaf ? 'clickable-leaf' : ''} role-${esc(p.role)}" data-id="${esc(id)}" data-leaf="${isLeaf}" tabindex="0" role="button" aria-expanded="false">
          ${lead}
          <span class="name">${esc(p.full_name || '—')}</span>
          <span class="tree-role">${esc(ROLE_LABELS[p.role] || p.role)}</span>
          <span class="tree-badges">${activeBadge}${companiesBadge}${todayBadge}${lastBadge}</span>
          <span class="tree-count">${countLabel}</span>
          <div class="tree-total-group">
            <span class="tree-total">${totalLabel}</span>
            <span class="tree-total salary">${salaryLabel}</span>
          </div>
        </div>
        <div class="${isLeaf ? 'leaf-detail' : 'tree-children'}"><div class="${isLeaf ? 'leaf-detail-inner' : 'tree-children-inner'}"></div></div>
      </div>
    `;
  }

  // شرکت‌هایی که اپراتور در آن‌ها فعال است؛ اگر سرگروهش گروه شرکت دارد، خارج از گروه‌ها جدا (خط‌چین) نشان داده می‌شوند
  function operatorCompanyChips(p, st) {
    const companies = splitCompanies(st && st.companies);
    if (!companies.length) return '';
    const group = state.scopeByLead[p.reports_to] || [];
    const inGroup = group.length ? group.filter((c) => companies.includes(c)) : companies;
    const outside = group.length ? companies.filter((c) => !group.includes(c)) : [];
    return `<span class="company-chips row-chips" title="شرکت‌های فعال">${
      inGroup.map((c) => `<span class="company-chip on">${esc(c)}</span>`).join('')
    }${
      outside.map((c) => `<span class="company-chip extra" title="خارج از شرکت‌های گروه">${esc(c)}</span>`).join('')
    }</span>`;
  }

  function buildLeafDetailHtml(id) {
    const p = state.profileById[id];
    const group = (p && state.scopeByLead[p.reports_to]) || [];
    const groupHtml = group.length
      ? renderGroupCompanies(state.statusByOperator[id], group, `شرکت‌های فعال ${p.full_name || ''} از شرکت‌های گروه`)
      : '';
    const rows = sortAsc(state.rawTargetsByOperator[id]);
    return groupHtml + (rows.length ? rowsTableHtml(rows) : '<div class="empty-state">رکوردی برای این فرد ثبت نشده است</div>');
  }


  // یک هندلر مشترک (event delegation) برای کل درخت — لازم نیست بعد از هر رندر دوباره وصل بشه
  function toggleRow(row) {
    const id = row.getAttribute('data-id');
    const isLeaf = row.getAttribute('data-leaf') === 'true';
    const box = row.nextElementSibling;
    if (!box) return;
    const inner = box.firstElementChild;

    if (box.classList.contains('open')) {
      box.classList.remove('open');
      row.classList.remove('open');
      row.setAttribute('aria-expanded', 'false');
      return;
    }

    if (!inner.children.length) {
      if (isLeaf) {
        inner.innerHTML = buildLeafDetailHtml(id);
      } else {
        const kids = sortKidsForDisplay(state.childrenOf[id] || []);
        if (!kids.length) return;
        inner.innerHTML = kids.map((cid, i) => buildNodeHtml(cid, i)).join('');
      }
    }
    box.classList.add('open');
    row.classList.add('open');
    row.setAttribute('aria-expanded', 'true');
  }

  $('content-area').addEventListener('click', (e) => {
    const row = e.target.closest('#tree-root .tree-row');
    if (row) toggleRow(row);
  });
  $('content-area').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('#tree-root .tree-row');
    if (row) { e.preventDefault(); toggleRow(row); }
  });

  // اگر قبلاً لاگین بوده، مستقیم وارد شو
  boot();
})();

</script>
<script>
// =====================================================================
// موشن‌ها (هم‌سان با داشبورد ازکی سنتر): کارت‌ها و ردیف‌ها هنگام ورود به دید، شیشه‌ای و
// پله‌پله ظاهر می‌شوند و هنگام خروج از دید، به سمت همان جهت محو می‌شوند.
// در به‌روزرسانی خودکار (window.__revealInstant) بدون انیمیشن نمایش داده می‌شوند تا صفحه چشمک نزند.
// =====================================================================
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion || !('IntersectionObserver' in window)) return;

  var revealSelector = ['.summary-card', '.panel', '.bot-panel', '.tree-row', '.view-tabs', '.search-row'].join(',');
  var REVEAL_MARGIN = 24;
  var batch = 0, batchTimer = null;

  function inViewport(el) {
    var r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return false;
    var vh = window.innerHeight || document.documentElement.clientHeight || 0;
    return r.top < (vh - REVEAL_MARGIN) && r.bottom > REVEAL_MARGIN;
  }
  function revealNow(el) { el.style.transitionDelay = '0ms'; el.classList.add('glass-in'); }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var el = entry.target;
      if (entry.isIntersecting) {
        var delay = (batch % 8) * 35;
        batch++;
        clearTimeout(batchTimer);
        batchTimer = setTimeout(function () { batch = 0; }, 180);
        el.style.transitionDelay = delay + 'ms';
        requestAnimationFrame(function () { el.classList.add('glass-in'); });
      } else {
        el.style.transitionDelay = '0ms';
        el.classList.remove('glass-in');
        el.style.setProperty('--reveal-offset', entry.boundingClientRect.top < 0 ? '-26px' : '26px');
      }
    });
  }, { threshold: 0, rootMargin: '0px 0px -' + REVEAL_MARGIN + 'px 0px' });

  function prepare(el) {
    if (el.dataset.glassObserved) return;
    el.dataset.glassObserved = '1';
    // به‌روزرسانی خودکار: از همان ابتدا در حالت نهایی (بدون ترنزیشن)
    if (window.__revealInstant) el.classList.add('glass-in');
    el.classList.add('glass-reveal');
    io.observe(el);
    if (!window.__revealInstant) {
      requestAnimationFrame(function () {
        if (!el.classList.contains('glass-in') && inViewport(el)) revealNow(el);
      });
    }
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches(revealSelector)) prepare(root);
    root.querySelectorAll(revealSelector).forEach(prepare);
  }

  function start() {
    scan(document);
    new MutationObserver(function (muts) {
      muts.forEach(function (m) { m.addedNodes.forEach(function (n) { if (n.nodeType === 1) scan(n); }); });
    }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
