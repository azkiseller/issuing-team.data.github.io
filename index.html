:root {
  --bg: transparent;
  --surface: rgba(255,255,255,.72);
  --surface-tint: rgba(217,236,255,.55);
  --ink: #0F1B33;
  --ink-soft: rgba(15,27,51,.68);
  --ink-faint: rgba(15,27,51,.46);
  --line: rgba(23,169,255,.32);
  --accent: #00B4FF;
  --accent-deep: #1656F5;
  --accent-soft: rgba(0,180,255,.20);
  --accent-strong: #0D8FCB;
  --danger: #E0453F;
  --danger-soft: rgba(224,69,63,.16);
  --good: #1FA971;
  --good-soft: rgba(31,169,113,.16);
  --warn: #E08A17;
  --radius-lg: 20px;
  --radius: 14px;
  --radius-sm: 9px;
  --glass-blur: 18px;
  --shadow-card: 0 8px 28px rgba(15,72,150,.14), inset 0 1px 0 rgba(255,255,255,.6);
  --shadow-float: 0 24px 55px -14px rgba(15,72,150,.22), inset 0 1px 0 rgba(255,255,255,.7);
  --font: 'IRANSansX', Tahoma, sans-serif;
  --topbar-bg: rgba(255,255,255,.4);
  /* رنگ‌های نمودار سهم شرکت‌ها: آبی روشن، فیروزه‌ای، بنفش، آسمانی، آبی‌بنفش؛ ترتیب ثابت و بررسی‌شده برای کوررنگی در هر دو تم */
  --cat-1: #70ADFF; --cat-2: #00CDB6; --cat-3: #B199FF; --cat-4: #008DCE;
  --cat-5: #8FA7FF; --cat-other: #CBD5E3;
}
html[data-theme="dark"] {
  --cat-1: #5893F6; --cat-2: #00AA93; --cat-3: #876DDA; --cat-4: #33A1D2;
  --cat-5: #5366CE; --cat-other: #4A5570;
  --surface: rgba(255,255,255,.07);
  --surface-tint: rgba(255,255,255,.04);
  --ink: #EAF0FB;
  --ink-soft: rgba(234,240,251,.68);
  --ink-faint: rgba(234,240,251,.44);
  --line: rgba(255,255,255,.14);
  --accent-deep: #4C8DFF;
  --accent-soft: rgba(0,180,255,.22);
  --accent-strong: #29C2FF;
  --danger: #FF6B64;
  --danger-soft: rgba(255,107,100,.18);
  --good: #34C98C;
  --good-soft: rgba(52,201,140,.18);
  --warn: #F2A93B;
  --shadow-card: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  --shadow-float: 0 24px 60px -16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
  --topbar-bg: rgba(10,15,28,.22);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: #0c1226;
  color: var(--ink);
  min-height: 100vh;
  transition: background .25s ease, color .25s ease;
}
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }

/* ====== پس‌زمینه‌ی انیمیشنی ====== */
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.55), transparent 62%),
    radial-gradient(680px 540px at 106% 6%, rgba(124,92,224,.4), transparent 62%),
    radial-gradient(700px 560px at 88% 102%, rgba(255,105,170,.32), transparent 62%),
    radial-gradient(640px 520px at 4% 104%, rgba(31,169,113,.3), transparent 62%),
    linear-gradient(160deg, #CDE8FF 0%, #EAF4FE 45%, #FFFFFF 100%);
  background-attachment: fixed;
  animation: glow-shift 24s ease-in-out infinite;
}
html[data-theme="dark"] .bg-glow {
  background:
    radial-gradient(620px 520px at 12% -8%, rgba(0,180,255,.32), transparent 60%),
    radial-gradient(680px 540px at 106% 6%, rgba(76,141,255,.28), transparent 60%),
    radial-gradient(700px 560px at 88% 102%, rgba(156,135,240,.26), transparent 60%),
    radial-gradient(640px 520px at 4% 104%, rgba(52,201,140,.2), transparent 60%),
    linear-gradient(135deg, #05070f 0%, #060a16 55%, #04070d 100%);
  background-attachment: fixed;
}
@keyframes glow-shift {
  0%, 100% { filter: saturate(1) hue-rotate(0deg); }
  50% { filter: saturate(1.18) hue-rotate(10deg); }
}
@media (prefers-reduced-motion: reduce) { .bg-glow { animation: none; } }

.theme-toggle {
  position: fixed; bottom: 16px; left: 16px; z-index: 9999;
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--surface);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  backdrop-filter: blur(14px) saturate(180%);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--ink); font-size: 17px;
  transition: background .25s ease, border-color .25s ease, transform .15s ease;
}
.theme-toggle:hover { transform: translateY(-1px); }
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

/* ---------- Login screen ---------- */
#login-screen {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.login-card {
  position: relative; z-index: 1;
  width: 100%; max-width: 380px;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 44px 36px 36px;
  box-shadow: var(--shadow-float);
  text-align: center;
  animation: rise .5s cubic-bezier(.2,.8,.2,1);
}
@media (max-width: 420px) { .login-card { padding: 36px 22px 28px; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.login-card h1 { font-size: 19px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
.login-card p.subtitle { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 28px; }
.field { margin-bottom: 16px; text-align: right; }
.field label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-soft); margin-bottom: 7px; }
.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);
  background: var(--surface-tint);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  backdrop-filter: blur(12px) saturate(160%);
  box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
  font-family: var(--font);
  font-size: 14px;
  color: var(--ink);
  outline: none;
  direction: ltr;
  text-align: right;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.field input:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
button { font-family: var(--font); cursor: pointer; }
button.primary {
  width: 100%;
  padding: 13px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, rgba(23,169,255,.85) 0%, rgba(22,86,245,.85) 100%);
  color: #fff;
  font-size: 14.5px;
  font-weight: 700;
  margin-top: 8px;
  box-shadow: 0 10px 24px -10px rgba(22,86,245,.55), inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .15s, box-shadow .15s, filter .15s;
}
button.primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
button.primary:disabled { background: var(--ink-faint); box-shadow: none; cursor: default; transform: none; }
.login-error {
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 13px; font-weight: 500;
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
  text-align: right;
}

/* ---------- App shell ---------- */
#app-screen { position: relative; z-index: 1; min-height: 100vh; }
.topbar-wrap { position: sticky; top: 0; z-index: 10; }
header.topbar {
  background: var(--topbar-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
@media (max-width: 560px) { header.topbar { padding: 12px 16px; } }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  box-shadow: 0 6px 16px -6px rgba(22,86,245,.5);
}
.user-name { font-weight: 700; font-size: 14px; }
.role-badge {
  display: inline-block;
  background: var(--accent-soft); color: var(--accent-strong);
  font-weight: 600; font-size: 11.5px;
  padding: 2px 10px; border-radius: 999px; margin-top: 3px;
}
.user-group-info { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
.topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.sync-note { font-size: 12px; color: var(--ink-faint); }
button.ghost {
  background: none; border: none;
  color: var(--ink-soft); font-size: 13px; padding: 0;
  transition: color .15s;
}
button.ghost:hover { color: var(--danger); }

main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 28px 24px 60px; }
@media (max-width: 560px) { main { padding: 20px 16px 60px; } }

/* ---------- Summary cards ---------- */
.summary-row {
  display: grid; gap: 14px; margin-bottom: 24px;
  grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
}
.summary-card {
  background: linear-gradient(135deg, rgba(22,86,245,.62) 0%, rgba(23,169,255,.62) 100%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
  min-height: 104px;
  container-type: inline-size;
  box-shadow: 0 16px 34px -16px rgba(22,86,245,.5), inset 0 1px 0 rgba(255,255,255,.45);
  position: relative; overflow: hidden;
}
.summary-card::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(140px 140px at 90% 0%, rgba(255,255,255,.25), transparent 70%);
}
.summary-card { text-align: center; align-items: center; }
.summary-card .label { font-size: 12px; color: rgba(255,255,255,.88); font-weight: 500; position: relative; line-height: 1.5; }
.summary-card .value {
  font-size: 36px; font-weight: 900; color: #fff;
  position: relative; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.summary-card .value.salary { color: #CFFFE6; font-size: 30px; }
.summary-card .sub { font-size: 12px; color: rgba(255,255,255,.85); margin-top: 4px; position: relative; }
.summary-card .value small { font-size: 13px; opacity: .85; font-weight: 600; }
.summary-card .value.date { font-size: 26px; }
.summary-card .label .unit { font-weight: 500; opacity: .8; }

/* ---------- Panels / tables ---------- */
.panel {
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-card);
}
.panel.companies {
  padding: 16px 20px; text-align: center; margin-bottom: 20px;
  background: rgba(0,180,255,.12); border-color: rgba(0,180,255,.4);
}
.panel.companies .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 8px; }
.panel.companies .names { font-weight: 700; font-size: 14.5px; }
table.rows { width: 100%; border-collapse: collapse; table-layout: fixed; }
table.rows th {
  padding: 10px 20px; font-size: 12px; font-weight: 500; color: var(--ink-faint);
  text-align: right; border-bottom: 1px solid var(--line);
}
table.rows td { padding: 8px 20px; font-size: 13.5px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.rows tbody tr { transition: background .12s; }
table.rows tbody tr:hover { background: var(--surface-tint); }
table.rows tbody tr:last-child td { border-bottom: none; }
table.rows th.num, table.rows td.num { text-align: center; width: 32%; }
table.rows td.date { font-variant-numeric: tabular-nums; }
table.rows .pill {
  display: inline-block; min-width: 64px; padding: 4px 12px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong);
  font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr;
}
table.rows .pill.salary { color: var(--good); background: var(--good-soft); }
@media (max-width: 560px) {
  table.rows th, table.rows td { padding-inline: 10px; }
  table.rows .pill { min-width: 0; padding: 3px 9px; }
}
.tree-children-inner > table.rows, .leaf-detail table.rows {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  border-collapse: separate; border-spacing: 0; overflow: hidden; margin-top: 8px;
}
.empty-state { padding: 44px 18px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* ---------- Org tree ---------- */
.tree-node { margin-bottom: 6px; }
.tree-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 13px 16px;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer; user-select: none;
  box-shadow: var(--shadow-card);
  transition: border-color .15s, transform .1s;
}
.tree-row:hover { border-color: var(--accent); transform: translateY(-1px); }
.tree-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tree-row .chevron {
  width: 14px; text-align: center; color: var(--ink-faint);
  font-size: 11px; transition: transform .25s cubic-bezier(.4,0,.2,1); flex-shrink: 0;
}
.tree-row.open .chevron { transform: rotate(90deg); color: var(--accent); }
.tree-row .leaf-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.tree-row .name { font-weight: 700; font-size: 13.5px; flex-shrink: 0; }
/* نقش: توپُر و پررنگ، تا با چیپ‌های کم‌رنگِ شرکت‌ها قاطی نشود */
.tree-row .tree-role {
  font-size: 11px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, var(--accent-deep), #0B3FC4);
  border-radius: 999px; padding: 2px 10px;
  box-shadow: 0 1px 4px rgba(22,86,245,.30);
  flex-shrink: 0;
}
.tree-row .spacer { flex: 1; }
/* برچسب‌ها وسط ردیف: اگر زیاد بودند همان‌جا به خط بعد می‌روند و جمع‌ها سمت چپ ثابت می‌مانند */
.tree-row .tree-badges { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tree-row .tree-badges:empty { min-height: 1px; }
@media (min-width: 561px) { .tree-row { flex-wrap: nowrap; } }
@media (max-width: 560px) {
  .tree-row .tree-badges { flex-basis: 100%; order: 5; }
  .tree-row .tree-badges:empty { display: none; }
  .tree-row .tree-count { margin-inline-start: auto; }
}
.tree-row .tree-total { font-size: 13.5px; font-weight: 700; color: var(--ink); direction: ltr; }
.tree-row .tree-count { font-size: 11px; color: var(--ink-faint); min-width: 76px; text-align: left; }
.tree-search {
  width: 100%;
  background: var(--surface-tint);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  backdrop-filter: blur(12px) saturate(160%);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 11px 15px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 13.5px;
  margin-bottom: 18px;
  box-shadow: inset 0 1px 4px rgba(15,72,150,.10);
}
.tree-search:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
select.tree-search option { color: #0F1B33; }
.filters { display: flex; gap: 10px; }
.filters .tree-search { flex: 1; }
.filters select.tree-search { max-width: 170px; flex: 0 0 auto; }
.section-label { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; font-weight: 500; }
.loading { color: var(--ink-faint); font-size: 13px; padding: 20px 0; }

.tree-row.clickable-leaf:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tree-total-group { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 96px; font-variant-numeric: tabular-nums; }
.tree-total-group .tree-total.salary { color: var(--good); font-size: 12px; }

.tree-row.role-team_lead {
  background: linear-gradient(135deg, rgba(0,180,255,.16) 0%, rgba(0,180,255,.08) 100%);
  border-color: rgba(0,180,255,.45);
}
.tree-row.role-team_lead:hover { border-color: var(--accent); }
.tree-row.role-team_lead .tree-role { background: linear-gradient(135deg, #3B3FD8, #2A1FA8); color: #fff; }
/* نود «تیم X و Y»: پررنگ‌تر از ردیف سرگروه */
.tree-row.role-team_pair {
  background: linear-gradient(135deg, rgba(22,86,245,.20) 0%, rgba(0,180,255,.12) 100%);
  border-color: rgba(22,86,245,.50);
}
.tree-row.role-team_pair:hover { border-color: var(--accent-deep); }
.tree-row.role-team_pair .name { font-size: 14.5px; font-weight: 800; }
.tree-row.role-team_pair .tree-role { background: linear-gradient(135deg, #0F5C73, #0A4356); color: #fff; }

/* ---------- Logo / brand ---------- */
.login-bg-logo {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; overflow: hidden;
}
.login-bg-logo img { width: min(720px, 140vw); opacity: .10; filter: blur(.5px); }
html[data-theme="dark"] .login-bg-logo img { opacity: .14; }
.login-logo-top { display: flex; justify-content: center; margin-bottom: 20px; min-height: 40px; }
.login-logo-top img { height: 40px; width: auto; }
.wordmark { font-weight: 800; font-size: 20px; color: var(--accent-strong); letter-spacing: .01em; direction: ltr; }
.topbar-brand { display: flex; align-items: center; gap: 10px; padding-inline-end: 14px; margin-inline-end: 14px; border-inline-end: 1px solid var(--line); }
.topbar-brand img { height: 24px; width: auto; }
.topbar-brand .wordmark { font-size: 15px; }
@media (max-width: 560px) {
  .topbar-brand { border-inline-end: none; padding-inline-end: 0; margin-inline-end: 0; }
  .topbar-brand img { height: 20px; }
}

/* ---------- وضعیت فعال/غیرفعال ---------- */
.pulse-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 0 rgba(52,201,140,.55);
  animation: pulseDot 1.6s ease-out infinite;
  margin-inline-end: 7px; vertical-align: middle; flex-shrink: 0;
}
.pulse-dot.sm { width: 7px; height: 7px; }
@keyframes pulseDot {
  0%   { box-shadow: 0 0 0 0 rgba(52,201,140,.55); }
  70%  { box-shadow: 0 0 0 9px rgba(52,201,140,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,201,140,0); }
}
@media (prefers-reduced-motion: reduce) { .pulse-dot { animation: none; } }

.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 0 2px var(--good-soft);
  background: var(--good);
}
.status-dot.inactive { background: #9CA3AF; box-shadow: 0 0 0 2px rgba(156,163,175,.22); }

.active-badge {
  font-size: 11px; font-weight: 700; color: var(--good);
  background: var(--good-soft); border-radius: 999px; padding: 2px 9px;
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.active-badge .status-dot { width: 6px; height: 6px; box-shadow: none; }

/* آبی نفتی پررنگ، تا با چیپ‌های آبیِ شرکت‌ها و نقش قاطی نشود */
.today-count-badge {
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,.88);
  background: linear-gradient(135deg, #0F5C73, #0A4356);
  border-radius: 999px; padding: 2px 10px;
  box-shadow: 0 1px 4px rgba(10,67,86,.30);
  flex-shrink: 0; white-space: nowrap;
}
.today-count-badge b { color: #fff; font-weight: 800; margin-inline-start: 2px; }
html[data-theme="dark"] .today-count-badge { background: linear-gradient(135deg, #16809E, #0F5C73); }
.last-active-badge {
  font-size: 11px; font-weight: 600; color: var(--ink-soft);
  background: rgba(140,140,140,.14); border-radius: 999px; padding: 2px 10px;
  flex-shrink: 0; white-space: nowrap;
}

.company-stats-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 9px; margin-bottom: 18px;
}
.company-pill {
  display: inline-flex; align-items: center;
  background: var(--surface);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 12.5px; font-weight: 600;
  color: var(--ink-soft);
  box-shadow: var(--shadow-card);
}
.company-pill b { color: var(--good); margin-inline-start: 5px; font-size: 13px; }
.company-pill.tiny { padding: 5px 12px; font-size: 11.5px; }
.company-pill.tiny.inactive-companies { opacity: .55; filter: grayscale(60%); }
.company-stats-row .company-pill {
  justify-content: space-between;
  width: 118px; height: 34px; flex: 0 0 auto;
  background: rgba(0,180,255,.14);
  border-color: rgba(0,180,255,.4);
}
.company-stats-row .company-pill .company-name {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60px;
}
html[data-theme="dark"] .company-stats-row .company-pill { background: rgba(0,180,255,.10); }

.operator-status-badges { display: flex; gap: 8px; align-items: center; }
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; font-weight: 600;
  border-radius: 999px; padding: 5px 11px;
  background: var(--good-soft); color: var(--good);
}
.status-pill.off { background: var(--danger-soft); color: var(--danger); }
.status-pill .status-dot { box-shadow: none; }

/* ---------- باز/بسته شدن روان ---------- */
.tree-children, .leaf-detail {
  display: grid;
  grid-template-rows: 0fr;
  margin-inline-start: 24px;
  padding-inline-start: 14px;
  border-inline-start: 1.5px dashed var(--line);
  margin-top: 0;
  transition: grid-template-rows .42s cubic-bezier(.4,0,.2,1), margin-top .42s ease, opacity .3s ease;
  opacity: 0;
}
@media (max-width: 560px) { .tree-children, .leaf-detail { margin-inline-start: 10px; padding-inline-start: 8px; } }
.tree-children.open, .leaf-detail.open { grid-template-rows: 1fr; margin-top: 6px; opacity: 1; }
.tree-children-inner, .leaf-detail-inner { overflow: hidden; min-height: 0; }
.leaf-detail-inner { padding: 4px 0 2px; }

@keyframes fadeInRow {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.tree-children-inner > .tree-node,
.leaf-detail-inner table.rows tr {
  animation: fadeInRow .32s cubic-bezier(.2,.8,.2,1) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
@media (prefers-reduced-motion: reduce) {
  .tree-children-inner > .tree-node, .leaf-detail-inner table.rows tr { animation: none; }
}

/* ---------- نمودار دونات شرکت‌ها و روند صدور روزانه (نمای اپراتور) ---------- */
.panel.chart { padding: 20px; margin-bottom: 20px; }
.panel.chart > .label { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
.panel.donut-panel { text-align: center; padding: 22px 20px; }
.donut-wrap { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
/* فقط حلقه رنگ می‌گیرد؛ وسط دایره شفاف است (mask) */
.donut { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
.donut::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--accent) 0 calc(var(--pct) * 1%), var(--surface-tint) 0 100%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 calc(100% - 12px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 calc(100% - 12px));
}
.donut-hole {
  position: absolute; inset: 14px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.donut-hole b { font-size: 20px; font-weight: 800; }
.donut-hole small { font-size: 11px; color: var(--ink-faint); }
.donut-info { text-align: right; max-width: 360px; display: grid; gap: 8px; }
.donut-info .updated { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
.donut-info .names { font-size: 13px; }
/* نمای شرکت‌های گروه: وسط‌چین؛ دایره سمت راست، شرکت‌ها کنارش همیشه در یک خط */
.panel.donut-panel.group-panel { text-align: center; }
.donut-wrap.group { justify-content: center; flex-wrap: nowrap; }
.donut-wrap.group .donut-info { max-width: 100%; min-width: 0; text-align: center; justify-items: center; }
.donut-wrap.group .company-chips { flex-wrap: nowrap; justify-content: safe center; overflow-x: auto; max-width: 100%; scrollbar-width: thin; padding-bottom: 2px; }
.donut-wrap.group .company-chip { white-space: nowrap; flex-shrink: 0; }
.donut-wrap.group .outside { justify-items: center; }
.donut-wrap.group .outside .company-chips { justify-content: center; }
.donut-hole b { line-height: 1.15; direction: rtl; unicode-bidi: isolate; }
.donut-hole small { line-height: 1.4; margin-top: 2px; }
@media (max-width: 560px) {
  .donut-wrap.group { flex-direction: column; align-items: center; gap: 16px; }
  .donut-wrap.group .donut-info { width: 100%; }
  .donut-wrap.group .company-chips { gap: 4px; }
  .donut-wrap.group .company-chip { font-size: 10.5px; padding: 3px 7px; }
  .donut-wrap.group .company-chip .chk { display: none; }
  .leaf-detail-inner .donut-panel { padding: 18px 10px; }
  .leaf-detail-inner .donut-wrap.group .company-chips { gap: 3px; }
  .leaf-detail-inner .donut-wrap.group .company-chip { font-size: 9.5px; padding: 3px 5px; }
}
.trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.trend-head .label { font-size: 13px; color: var(--ink-soft); }
.trend-max { font-size: 11.5px; color: var(--ink-faint); }
.trend-plot {
  position: relative; height: 170px; margin: 10px 6px 0;
  direction: ltr; touch-action: pan-y; outline: none;
}
.trend-plot:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); border-radius: 8px; }
.trend-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.trend .trend-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.trend .trend-grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.trend .trend-fill-top { stop-color: var(--accent); stop-opacity: .32; }
.trend .trend-fill-bottom { stop-color: var(--accent); stop-opacity: 0; }
.trend-dot {
  position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
  background: var(--accent-strong); box-shadow: 0 0 0 2px var(--surface); pointer-events: none;
  transition: transform .12s;
}
.trend-dot.active { transform: scale(1.6); }
.trend-tip {
  position: absolute; transform: translate(-50%, calc(-100% - 12px));
  background: var(--ink); color: var(--surface-solid, #fff);
  padding: 6px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  direction: rtl; box-shadow: 0 6px 18px rgba(0,0,0,.18); z-index: 2;
}
html[data-theme="dark"] .trend-tip { background: #EAF0FB; color: #0F1B33; }
.trend-tip b { font-size: 13px; font-weight: 800; }
.trend-tip span { font-size: 11px; opacity: .75; }
.trend-tip.edge-left { transform: translate(0, calc(-100% - 12px)); }
.trend-tip.edge-right { transform: translate(-100%, calc(-100% - 12px)); }
.trend-tip.below { transform: translate(-50%, 12px); }
.trend-tip.below.edge-left { transform: translate(0, 12px); }
.trend-tip.below.edge-right { transform: translate(-100%, 12px); }
.trend-axis { display: flex; justify-content: space-between; direction: ltr; font-size: 11px; color: var(--ink-faint); margin: 8px 6px 0; }

/* ---------- پنل بات صدور خودکار (نمای مدیریتی) ---------- */
.bot-panel {
  margin-bottom: 22px; padding: 18px;
  border-radius: var(--radius-lg); border: 1px solid rgba(124,92,224,.35);
  background: linear-gradient(135deg, rgba(124,92,224,.12) 0%, rgba(0,180,255,.10) 100%);
  box-shadow: var(--shadow-card);
}
.bot-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.bot-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.bot-icon { font-size: 20px; line-height: 1; }
.bot-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.bot-stat {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 14px; text-align: center; container-type: inline-size;
}
.bot-stat .label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
.bot-stat .label .unit { opacity: .8; }
.bot-stat .value { font-size: clamp(16px, 13cqi, 21px); font-weight: 900; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bot-stat.saved .value { color: var(--good); }
.bot-panel .panel.chart { margin-bottom: 0; }

/* بسته (پیش‌فرض): جمع‌وجور، سه عدد کوچک در یک ردیف. باز: اندازه‌ی کامل + نمودار */
.bot-toggle { cursor: pointer; border-radius: var(--radius); }
.bot-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.bot-more { margin-inline-start: auto; font-size: 11.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
.bot-chevron { display: inline-block; font-size: 12px; transition: transform .2s; }
.bot-panel:not(.open) .bot-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.bot-panel:not(.open) .bot-stat .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bot-panel:not(.open) .bot-stat .label .unit { display: none; }
@media (max-width: 560px) { .bot-panel:not(.open) .bot-stat .label .long { display: none; } }
.bot-panel.open .bot-chevron { transform: rotate(180deg); }
.bot-panel { transition: padding .25s ease; }
.bot-panel:not(.open) { padding: 12px 16px; }
.bot-panel:not(.open) .bot-head { margin-bottom: 8px; }
.bot-panel:not(.open) .bot-head h2 { font-size: 14px; }
.bot-panel:not(.open) .bot-icon { font-size: 17px; }
.bot-panel:not(.open) .bot-stats { gap: 8px; margin-bottom: 0; }
.bot-panel:not(.open) .bot-stat { padding: 7px 10px; }
.bot-panel:not(.open) .bot-stat .label { font-size: 11px; margin-bottom: 1px; }
.bot-panel:not(.open) .bot-stat .value { font-size: clamp(14px, 10cqi, 17px); }
.bot-panel:not(.open):hover { border-color: rgba(124,92,224,.6); }
.bot-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.bot-panel.open .bot-drawer { grid-template-rows: 1fr; }
.bot-drawer-inner { overflow: hidden; min-height: 0; }
@media (prefers-reduced-motion: reduce) { .bot-panel, .bot-drawer, .bot-chevron { transition: none; } }

/* شرکت‌های گروه در نمای اپراتور: فعال‌ها پررنگ */
.company-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.company-chip {
  font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
  background: var(--surface-tint); color: var(--ink-faint); border: 1px solid var(--line);
}
.company-chip.on { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; font-weight: 700; }
.company-chip.extra { background: transparent; color: var(--accent-strong); border: 1px dashed var(--accent); font-weight: 700; }
.donut-info .outside { display: grid; gap: 6px; }
.donut-info .outside .label { font-size: 12px; color: var(--ink-soft); margin: 0; }
.donut-info .outside .company-chips { flex-wrap: wrap; overflow: visible; }
/* شرکت‌های اپراتور در درخت (سرگروه/سرپرست) */
.tree-row .company-chips.row-chips { gap: 4px; }
.tree-row .row-chips .company-chip { font-size: 11px; padding: 2px 9px; }
.leaf-detail-inner .donut-panel { margin-bottom: 12px; }

/* ---------- سهم شرکت‌ها از صدورهای ماه (نمای اپراتور) ---------- */
.panel.share-panel { text-align: center; padding: 22px 20px; }
/* دو دونات کنار هم (سهم شرکت‌ها | فراوانی سفارشات)؛ موبایل زیر هم */
.share-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.share-pair > .panel { margin-bottom: 0; min-width: 0; }
.share-pair { margin-bottom: 18px; }
.share-pair .share-wrap { gap: 18px; }
.share-pair .share-legend { min-width: 0; }
@media (max-width: 860px) { .share-pair { grid-template-columns: 1fr; } }
.share-wrap { display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; margin-top: 6px; }
.share-donut { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
.share-donut svg { width: 100%; height: 100%; display: block; overflow: visible; }
.share-track { fill: none; stroke: var(--surface-tint); stroke-width: 14; }
.share-arc { fill: none; stroke-width: 14; transition: opacity .15s, stroke-width .15s; cursor: default; }
.share-panel.has-hl .share-arc { opacity: .3; }
.share-panel.has-hl .share-arc.hl { opacity: 1; stroke-width: 17; }
.share-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.share-center b { font-size: 22px; font-weight: 800; line-height: 1.15; }
.share-center small { font-size: 11px; color: var(--ink-faint); }
.share-legend { border-collapse: collapse; font-size: 12.5px; min-width: 220px; }
.share-legend th { font-size: 11px; font-weight: 600; color: var(--ink-faint); padding: 0 10px 6px; text-align: right; }
.share-legend th:not(:first-child), .share-legend td.num { text-align: left; font-variant-numeric: tabular-nums; }
.share-legend td { padding: 5px 10px; border-top: 1px solid var(--line); color: var(--ink); white-space: nowrap; text-align: right; }
.share-legend td.num { color: var(--ink-soft); }
.share-legend td.num b { color: var(--ink); font-weight: 800; }
.share-legend tr { transition: opacity .15s; }
.share-panel.has-hl .share-legend tbody tr { opacity: .4; }
.share-panel.has-hl .share-legend tbody tr.hl { opacity: 1; }
.share-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 8px; vertical-align: middle; }
@media (max-width: 560px) {
  .share-wrap { gap: 16px; }
  .share-legend { width: 100%; }
}

/* ---------- رتبه‌ی امروز در تیم (نمای اپراتور) ---------- */
.rank-card .value { display: flex; align-items: center; justify-content: center; gap: 8px; }
.rank-card .value small { font-size: .6em; font-weight: 700; opacity: .85; }
.medal { width: 30px; height: 37px; flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
.medal .ribbon-l { fill: #1656F5; } .medal .ribbon-r { fill: #00B4FF; }
.medal text { font: 800 11px var(--font); fill: rgba(0,0,0,.55); }
.medal.gold .disc { fill: #F5C542; } .medal.gold .ring { fill: none; stroke: #FFE58A; stroke-width: 1.5; }
.medal.silver .disc { fill: #C9D1DC; } .medal.silver .ring { fill: none; stroke: #F1F4F8; stroke-width: 1.5; }
.medal.bronze .disc { fill: #D08A4E; } .medal.bronze .ring { fill: none; stroke: #F0B98A; stroke-width: 1.5; }

/* ---------- تب‌ها و شاخص‌های عملکرد (رول سرگروه) ---------- */
.view-tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 18px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur)); }
.view-tabs button { font: 700 13px var(--font); color: var(--ink-soft); background: transparent; border: 0;
  padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
.view-tabs button[aria-selected="true"] { color: #fff; background: linear-gradient(135deg, var(--accent-deep), var(--accent)); box-shadow: 0 2px 8px rgba(22,86,245,.3); }
.view-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel.kpi-total { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  background: linear-gradient(135deg, rgba(22,86,245,.14), rgba(0,180,255,.10)); }
.kpi-total .label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
.kpi-total-value b { font-size: 26px; font-weight: 900; color: var(--good); font-variant-numeric: tabular-nums; }
.kpi-total-value span { font-size: 12.5px; color: var(--ink-soft); }
.kpi-note, .kpi-updated { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; margin-top: 14px; }
.panel.kpi-card { margin: 0; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.kpi-card.empty { opacity: .7; }
.kpi-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.kpi-title { font-size: 15px; font-weight: 800; color: var(--ink); text-align: right; unicode-bidi: isolate; }
.kpi-desc { font-size: 11.5px; color: var(--ink-faint); margin-top: 2px; }
.kpi-scope { font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap; border-radius: 999px; padding: 3px 10px;
  background: linear-gradient(135deg, #0F5C73, #0A4356); }
.kpi-value { font-size: 28px; font-weight: 900; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-inline-start: 4px; }
.kpi-sub { display: block; font-size: 12px; font-weight: 600; color: var(--ink-faint); margin-top: 2px; }
.kpi-meter { direction: rtl; display: flex; height: 10px; border-radius: 999px; background: var(--surface-tint); border: 1px solid var(--line); overflow: hidden; }
.kpi-meter-fill { height: 100%; border-radius: 999px; background: linear-gradient(270deg, var(--accent), var(--accent-deep)); }
.kpi-bounds { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); }
.kpi-pay { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); }
.kpi-pay b { font-size: 17px; font-weight: 900; color: var(--good); font-variant-numeric: tabular-nums; }
.kpi-pay em { font-style: normal; margin-inline-start: auto; font-weight: 800; color: var(--accent-strong); }
.kpi-pay.muted { color: var(--ink-faint); font-style: italic; }

.trend-foot { font-size: 11.5px; color: var(--ink-faint); margin-top: 6px; text-align: right; }

/* کارت «کاربران فعال» سرپرست: با کلیک، نمودار ساعتی زیر ردیف کارت‌ها باز می‌شود */
.summary-card.expandable { cursor: pointer; position: relative; transition: transform .15s, box-shadow .15s; }
.summary-card.expandable:hover { transform: translateY(-2px); }
.summary-card.expandable:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.summary-card.expandable.open { box-shadow: 0 0 0 2px rgba(255,255,255,.85), var(--shadow-card); }
/* عدد بالاتر، راهنما جدا در پایین کارت */
.summary-card.expandable { justify-content: flex-start; padding-bottom: 38px; }
.summary-card.expandable .value { margin-top: 6px; }
.card-hint {
  position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  font-size: 10.5px; font-weight: 800; color: #0B6B3F;
  background: rgba(255,255,255,.88); border-radius: 999px; padding: 2px 10px;
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
html[data-theme="dark"] .card-hint { color: #7CF0B0; background: rgba(8,20,40,.55); box-shadow: none; }
/* نمودار پرنقطه (۹۶ ربع ساعت): نقطه‌ها فقط هنگام هاور؛ نقطه‌ی تنها همیشه */
.trend.dense .trend-dot { opacity: 0; transition: opacity .1s; }
.trend.dense .trend-dot.active, .trend.dense .trend-dot.solo { opacity: 1; }
.card-chevron { display: inline-block; transition: transform .2s; }
.summary-card.open .card-chevron { transform: rotate(180deg); }
.hourly-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease, margin .3s ease; }
.hourly-drawer.open { grid-template-rows: 1fr; margin-bottom: 18px; }
.hourly-drawer-inner { overflow: hidden; min-height: 0; }
.hourly-drawer-inner > .panel { margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) { .hourly-drawer, .card-chevron { transition: none; } }

/* ---------- شرکت‌ها به تفکیک گروه (سرپرست) ---------- */
.company-groups {
  margin-bottom: 18px; padding: 12px 16px; border-radius: var(--radius-lg);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card);
  -webkit-backdrop-filter: blur(var(--glass-blur)); backdrop-filter: blur(var(--glass-blur));
}
.cg-toggle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; cursor: pointer; border-radius: var(--radius); }
.cg-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.company-groups:not(.open):hover { border-color: var(--accent); }
.cg-title { font-size: 13.5px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.cg-summary { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
.cg-sum { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
  background: var(--accent-soft); font-size: 12px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
.cg-sum b { font-size: 14px; font-weight: 900; color: var(--good); font-variant-numeric: tabular-nums; }
.cg-more { font-size: 11.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; margin-inline-start: auto; }
.cg-chevron { display: inline-block; font-size: 12px; transition: transform .2s; }
.company-groups.open .cg-chevron { transform: rotate(180deg); }
.cg-drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.company-groups.open .cg-drawer { grid-template-rows: 1fr; }
.cg-drawer-inner { overflow: hidden; min-height: 0; }
.company-groups.open .cg-drawer-inner { padding-top: 12px; }
.cg-row { padding: 10px 0; border-top: 1px solid var(--line); }
.cg-row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
.cg-row-head b { color: var(--good); font-weight: 900; }
.cg-chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.cg-chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
  background: var(--surface-tint); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
.cg-chip b { margin-inline-start: auto; color: var(--good); font-weight: 900; font-variant-numeric: tabular-nums; }
.cg-chip.zero { opacity: .5; }
.cg-chip.zero .pulse-dot { animation: none; background: var(--ink-faint); box-shadow: none; }
@media (max-width: 560px) {
  .cg-summary { flex-basis: 100%; order: 3; }
  .cg-sum { flex: 1; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) { .cg-drawer, .cg-chevron { transition: none; } }

/* ---------- انتخاب‌گر واحد (منیجر / سرپرست ارشد) ---------- */
.unit-switch { display: inline-flex; gap: 3px; padding: 3px; margin-inline-start: 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); align-self: center; }
.unit-opt { font: 700 12px var(--font); padding: 6px 14px; border-radius: 999px; color: var(--ink-soft);
  text-decoration: none; white-space: nowrap; }
.unit-opt.active { color: #fff; background: linear-gradient(135deg, var(--accent-deep), var(--accent)); }
a.unit-opt:hover { background: var(--accent-soft); color: var(--accent-strong); }
.unit-opt.disabled { opacity: .55; cursor: default; }
.unit-opt small { font-size: 10px; font-weight: 600; }
@media (max-width: 560px) { .unit-switch { margin-inline-start: 0; margin-top: 8px; order: 5; } }

.panel.center-notice { padding: 28px 24px; text-align: center; }
.center-notice-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
.center-notice p { color: var(--ink-soft); font-size: 13.5px; margin: 6px 0; }
.center-notice .center-link { display: inline-block; margin-top: 12px; padding: 10px 22px; border-radius: 999px; text-decoration: none; }

/* ---------- موشن ورود شیشه‌ای (هم‌سان با ازکی سنتر؛ اسکریپت: motion.js) ---------- */
.glass-reveal {
  opacity: 0;
  transform: translateY(var(--reveal-offset, 18px)) scale(.99);
  transition: opacity .38s cubic-bezier(.2,.8,.2,1), transform .38s cubic-bezier(.2,.8,.2,1),
              border-color .2s ease, box-shadow .2s ease, background .25s ease;
}
.glass-reveal.glass-in { opacity: 1; transform: none; }
/* حالت hover قبلی که با transform ورود جایگزین می‌شد */
.glass-reveal.glass-in.tree-row:hover { transform: translateY(-1px); }
.glass-reveal.glass-in.summary-card.expandable:hover { transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) {
  .glass-reveal, .glass-reveal.glass-in { opacity: 1; transform: none; transition: none; }
}

</style>
</head>

<script>
'use strict';

// =====================================================================
// داشبورد عملکرد اپراتورها — منطق فرانت
// ---------------------------------------------------------------------
// همه‌ی کنترل دسترسی داخل Supabase (RLS) انجام می‌شه. این فایل فقط
// چیزی رو نمایش می‌ده که دیتابیس اجازه‌ی خوندنش رو به کاربر لاگین‌شده داده.
// =====================================================================

(function () {
  // ---------------------------------------------------------------
  // راه‌اندازی
  // ---------------------------------------------------------------
  const cfg = window.APP_CONFIG;
  const $ = (id) => document.getElementById(id);

  // اعداد کارت‌های خلاصه: با بزرگ‌ترین اندازه‌ی CSS شروع می‌شن و فقط اگه توی کارت جا نشن، به‌اندازه‌ی لازم کوچیک می‌شن
  // (یه عدد سه‌رقمی بزرگ می‌مونه، حقوق ۱۴ کاراکتری فقط تا جایی که جا بشه کوچیک می‌شه). با هر رندر و تغییر عرض اجرا می‌شه.
  function fitSummaryValues() {
    document.querySelectorAll('#summary-row .summary-card .value').forEach((v) => {
      v.style.fontSize = '';
      const card = v.closest('.summary-card');
      const cs = getComputedStyle(card);
      const avail = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (avail > 0 && v.scrollWidth > avail) {
        const fs = parseFloat(getComputedStyle(v).fontSize);
        v.style.fontSize = Math.max(11, Math.floor(fs * avail / v.scrollWidth * 0.97)) + 'px';
      }
    });
  }
  (function watchSummaryRow() {
    const row = $('summary-row');
    if (!row) return;
    let raf = 0;
    const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fitSummaryValues); };
    new MutationObserver(schedule).observe(row, { childList: true, subtree: true, characterData: true });
    if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(row);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);
  })();

  // تم
  $('theme-toggle').addEventListener('click', () => {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('dashboardTheme', next); } catch (e) {}
  });

  // اگه فایل لوگو موجود نبود، به‌جاش اسم برند رو به‌صورت متن نشون بده
  document.querySelectorAll('img.logo-img').forEach((img) => {
    img.addEventListener('error', () => {
      if (img.alt) {
        const span = document.createElement('span');
        span.className = 'wordmark';
        span.textContent = img.alt;
        img.replaceWith(span);
      } else {
        img.remove();
      }
    }, { once: true });
  });

  if (!window.supabase || !cfg) {
    showLoginError('بارگذاری کتابخانه‌ی Supabase ناموفق بود. اتصال اینترنت را بررسی و صفحه را دوباره بارگذاری کنید.');
    $('login-btn').disabled = true;
    return;
  }

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  // ورود یکپارچه‌ی منیجر/سرپرست ارشد با ازکی سنتر: هر دو صفحه روی یک دامنه‌اند و هر پروژه سشن خودش را
  // با کلید جدا در localStorage نگه می‌دارد. سشن طرف دیگر با تابع sso-bridge ساخته می‌شود: توکن این طرف
  // را می‌گیرد، اعتبارسنجی و نقش را چک می‌کند و یک توکن یک‌بارمصرف ورود برمی‌گرداند (بدون رمز).
  let centerSb = null;
  function getCenterSb() {
    if (!centerSb && cfg.CENTER_SUPABASE_URL && cfg.CENTER_SUPABASE_KEY) {
      centerSb = window.supabase.createClient(cfg.CENTER_SUPABASE_URL, cfg.CENTER_SUPABASE_KEY, {
        auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: false },
      });
    }
    return centerSb;
  }
  let centerLogin = null; // Promise ساخت سشن ازکی سنتر؛ لینک «ازکی سنتر» قبل از رفتن منتظرش می‌ماند
  const CENTER_TOKEN_KEY = cfg.CENTER_SUPABASE_URL
    ? `sb-${new URL(cfg.CENTER_SUPABASE_URL).host.split('.')[0]}-auth-token` : '';

  // از سشنِ «from» یک سشن در «to» می‌سازد (پروژه‌ی مقصد باید تابع sso-bridge داشته باشد)
  async function bridgeSession(fromClient, toClient, toUrl, toKey) {
    const { data: from } = await fromClient.auth.getSession();
    if (!from.session) return false;
    const res = await fetch(`${toUrl}/functions/v1/sso-bridge`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: toKey },
      body: JSON.stringify({ peer_token: from.session.access_token }),
    });
    if (!res.ok) return false;
    const { token_hash } = await res.json();
    if (!token_hash) return false;
    const { error } = await toClient.auth.verifyOtp({ token_hash, type: 'magiclink' });
    return !error;
  }
  async function ensureCenterSession() {
    const csb = getCenterSb();
    if (!csb) return false;
    try {
      const { data } = await csb.auth.getSession();
      if (data.session) return true;
      return await bridgeSession(sb, csb, cfg.CENTER_SUPABASE_URL, cfg.CENTER_SUPABASE_KEY);
    } catch (e) { console.warn('ساخت سشن ازکی سنتر ناموفق بود', e); return false; }
  }
  // بدون سشن این طرف ولی با سشن ازکی سنتر (منیجر/ارشدی که از آنجا آمده): ورود خودکار
  async function tryLoginFromCenter() {
    let has = false;
    try { has = !!(CENTER_TOKEN_KEY && localStorage.getItem(CENTER_TOKEN_KEY)); } catch (e) {}
    if (!has) return false;
    try { return await bridgeSession(getCenterSb(), sb, cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY); }
    catch (e) { return false; }
  }

  const ROLE_LABELS = {
    operator: 'اپراتور',
    team_lead: 'سرگروه',
    supervisor: 'سرپرست',
    senior_supervisor: 'سرپرست ارشد',
    manager: 'مدیر',
    senior_manager: 'مدیر ارشد',
    team_pair: 'دو تیم',
  };
  // نودهای مجازی: «تیم X و Y» برای سرگروه‌های پارتنر، و ریشه‌ی درخت برای سرگروهِ دارای پارتنر
  const PAIR_PREFIX = '__pair:';
  const TREE_ROOT_ID = '__root';
  const isVirtualId = (id) => String(id).startsWith('__');
  // منیجر و سرپرست ارشد: کل ازکی سلر + دسترسی به ازکی سنتر
  const SEES_ALL_ROLES = ['senior_manager', 'manager', 'senior_supervisor'];
  const SUPERVISOR_ROLES = ['supervisor', 'senior_supervisor', 'manager', 'senior_manager'];

  const RECENT_DAYS_LIMIT = 200;

  // بات صدور خودکار: در درخت و جمع‌های تیم حساب نمی‌شه و در نمای مدیریتی جدا با نمودار خودش نمایش داده می‌شه
  const BOT_NAME = 'بات صدور خودکار';

  // سرگروه‌هایی که با هم یک «گروه» هستند (برای نمایش «گروه X و Y» در هدر اپراتورهای زیرشان)
  const TEAM_LEAD_GROUPS = [
    ['مهدی فراهانی', 'سرگروه ایران'],
    ['مهدی ایازی', 'فاطمه دهقانپور'],
    ['آتنا مالمیر', 'امیررضا فلاح'],
  ];

  function getGroupLabel(teamLeadName) {
    const grp = TEAM_LEAD_GROUPS.find((g) => g.includes(teamLeadName));
    if (!grp) return null;
    return 'گروه ' + grp.map((n) => n.trim().split(/\s+/)[0]).join(' و ');
  }

  // ---------------------------------------------------------------
  // ابزارهای کمکی
  // ---------------------------------------------------------------
  // جلوگیری از تزریق HTML: هر متنی که از دیتابیس میاد قبل از رفتن توی innerHTML escape می‌شه
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ارقام انگلیسی داخل متن (مثل تاریخ 1405/06/30) رو فارسی می‌کنه تا با بقیه‌ی اعداد یکدست باشه
  function faDigits(v) {
    return String(v == null ? '' : v).replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
  }

  // سری روزانه برای نمودار: یک نقطه برای هر روز دوره تا امروز؛ روزهای بدون رکورد = ۰
  function dailySeries(rows) {
    const bySort = {};
    (rows || []).forEach((r) => {
      const k = Number(r.report_date_sort) || 0;
      bySort[k] = (bySort[k] || 0) + (Number(r.target_count) || 0);
    });
    return periodDaysUntilToday().map((d) => ({
      report_date_sort: String(d.sort),
      report_date_jalali: d.jalali,
      target_count: bySort[d.sort] || 0,
    }));
  }

  // تاریخ‌ها صعودی (قدیمی‌ترین اول) — برای جدول‌ها و نمودار
  function sortAsc(rows) {
    return (rows || []).slice().sort((a, b) => (Number(a.report_date_sort) || 0) - (Number(b.report_date_sort) || 0));
  }

  function formatNum(n) {
    return Number(n || 0).toLocaleString('fa-IR');
  }

  function splitCompanies(str) {
    return (str || '').split('،').map((s) => s.trim()).filter(Boolean);
  }

  function showLoginError(msg) {
    const box = $('login-error');
    box.textContent = msg;
    box.hidden = false;
  }

  // ---------------------------------------------------------------
  // تاریخ شمسی و بازه‌ی حقوق (۲۱ هر ماه تا ۲۰ ماه بعد)
  // ---------------------------------------------------------------
  function gregorianToJalali(gy, gm, gd) {
    const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy;
    if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
    const gy2 = (gm > 2) ? (gy + 1) : gy;
    let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
    let jm, jd;
    if (days < 186) { jm = 1 + Math.floor(days / 31); jd = 1 + (days % 31); }
    else { jm = 7 + Math.floor((days - 186) / 30); jd = 1 + ((days - 186) % 30); }
    return [jy, jm, jd];
  }

  function getTodayJalali() {
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit' });
    const [gy, gm, gd] = fmt.format(new Date()).split('-').map(Number);
    return gregorianToJalali(gy, gm, gd);
  }

  const PERSIAN_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

  function getCurrentPeriod() {
    const [jy, jm, jd] = getTodayJalali();
    let startY, startM, endY, endM;
    if (jd >= 21) {
      startY = jy; startM = jm;
      endM = jm + 1; endY = jy;
      if (endM > 12) { endM = 1; endY = jy + 1; }
    } else {
      endY = jy; endM = jm;
      startM = jm - 1; startY = jy;
      if (startM < 1) { startM = 12; startY = jy - 1; }
    }
    return {
      startSort: String(startY * 10000 + startM * 100 + 21),
      endSort: String(endY * 10000 + endM * 100 + 20),
      label: `${PERSIAN_MONTHS[endM - 1]} ماه`,
    };
  }

  const CURRENT_PERIOD = getCurrentPeriod();
  const TODAY = getTodayJalali();
  const TODAY_SORT = TODAY[0] * 10000 + TODAY[1] * 100 + TODAY[2];

  // همه‌ی روزهای دوره‌ی جاری از ۲۱ام تا امروز (صعودی) — برای نمودارها، تا روزهای بدون رکورد صفر دیده بشن
  function periodDaysUntilToday() {
    const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran', year: 'numeric', month: '2-digit', day: '2-digit' });
    const [gy, gm, gd] = fmt.format(new Date()).split('-').map(Number);
    const base = Date.UTC(gy, gm - 1, gd);
    const start = Number(CURRENT_PERIOD.startSort);
    const days = [];
    for (let k = 0; k < 40; k++) {
      const d = new Date(base - k * 86400000);
      const [jy, jm, jd] = gregorianToJalali(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
      const sort = jy * 10000 + jm * 100 + jd;
      if (sort < start) break;
      days.push({ sort, jalali: `${jy}/${String(jm).padStart(2, '0')}/${String(jd).padStart(2, '0')}` });
    }
    return days.reverse();
  }

  // ---------------------------------------------------------------
  // وضعیت برنامه
  // ---------------------------------------------------------------
  const state = {
    profile: null,
    viewerRole: null,
    visibleProfiles: [],
    profileById: {},
    childrenOf: {},
    targetsByOperator: {},
    rawTargetsByOperator: {},
    statusByOperator: {},
    scopeByLead: {},
    subtreeTotal: {},
    subtreeSalary: {},
    activeCountBySubtree: {},
    search: '',
    companyFilter: '',
    treeRootId: null,
    activeTab: 'team',
    hourlyOpen: false,
    botOpen: false,
    companiesOpen: false,
    treeIds: new Set(),
  };

  function isFullyActive(st) {
    return !!(st && st.is_active === true && st.is_active_to_issue === true);
  }

  // ---------------------------------------------------------------
  // ورود / خروج
  // ---------------------------------------------------------------
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const raw = $('login-username').value.trim();
    const email = raw.includes('@') ? raw : `${raw}@${cfg.EMAIL_DOMAIN}`;
    const password = $('login-password').value;
    const btn = $('login-btn');
    $('login-error').hidden = true;
    btn.disabled = true;
    btn.textContent = 'در حال ورود...';

    // صفحه‌ی ورود مشترک: همان نام کاربری/رمز هم‌زمان روی هر دو پروژه امتحان می‌شود و هر کس
    // به داشبورد واحد خودش می‌رود (فقط سلر → همین‌جا، فقط سنتر → ازکی سنتر، هر دو → همین‌جا با انتخاب‌گر واحد)
    const csb = getCenterSb();
    const [sellerTry, centerTry] = await Promise.allSettled([
      sb.auth.signInWithPassword({ email, password }),
      csb ? csb.auth.signInWithPassword({ email, password }) : Promise.resolve({ error: { message: 'no center' } }),
    ]);
    const okOf = (t) => t.status === 'fulfilled' && !t.value.error && t.value.data && t.value.data.session;
    const sellerOk = okOf(sellerTry);
    const centerOk = okOf(centerTry);

    btn.disabled = false;
    btn.textContent = 'ورود';

    if (!sellerOk && centerOk) {
      $('login-password').value = '';
      location.href = cfg.CENTER_URL; // کاربر فقط ازکی سنتر: سشن ساخته شده، صفحه‌ی سنتر مستقیم باز می‌شود
      return;
    }
    if (!sellerOk && !centerOk) {
      if (sellerTry.status === 'rejected' && centerTry.status === 'rejected') {
        showLoginError('اتصال به سرور برقرار نشد. لطفاً دوباره تلاش کنید.');
        return;
      }
      const result = sellerTry.status === 'fulfilled' ? sellerTry.value : centerTry.value;
      const msg = (result.error && result.error.message) || '';
      if (/invalid.*credentials/i.test(msg)) showLoginError('نام کاربری یا رمز عبور اشتباه است.');
      else if (/rate|too many/i.test(msg)) showLoginError('تعداد تلاش‌ها زیاد بود. چند دقیقه بعد دوباره امتحان کنید.');
      else showLoginError('ورود ناموفق بود. لطفاً دوباره تلاش کنید.');
      return;
    }

    $('login-password').value = '';
    if (centerOk) centerLogin = Promise.resolve(true);
    await boot();
  });

  $('logout-btn').addEventListener('click', async () => {
    try { await sb.auth.signOut(); } catch (e) {}
    // خروج از ازکی سنتر هم (برای منیجر/سرپرست ارشد که هم‌زمان وارد شده‌اند)
    try {
      const csb = getCenterSb();
      if (csb) { const { data } = await csb.auth.getSession(); if (data.session) await csb.auth.signOut(); }
    } catch (e) {}
    location.reload();
  });

  // اگه سشن از جای دیگه منقضی یا خارج شد، برگرد به صفحه‌ی ورود
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' && state.profile) location.reload();
  });

  // ---------------------------------------------------------------
  // شروع برنامه بعد از لاگین
  // ---------------------------------------------------------------
  async function boot() {
    let { data: sessionData } = await sb.auth.getSession();
    if (!sessionData.session && await tryLoginFromCenter()) ({ data: sessionData } = await sb.auth.getSession());
    if (!sessionData.session) {
      // سشن ازکی سنتر دارد ولی حساب ازکی سلر نه (کاربر فقط سنتر): به داشبورد خودش برود
      const csb = getCenterSb();
      if (csb && cfg.CENTER_URL) {
        try {
          const { data } = await csb.auth.getSession();
          if (data.session) { location.replace(cfg.CENTER_URL); return; }
        } catch (e) {}
      }
      return;
    }

    $('login-screen').hidden = true;
    $('app-screen').hidden = false;

    const userId = sessionData.session.user.id;
    const { data: profile, error } = await sb
      .from('profiles')
      .select('id, full_name, role, reports_to, unit')
      .eq('id', userId)
      .maybeSingle();

    if (error) {
      // متن کامل خطا فقط در Console؛ به کاربر فقط کد خطا نشون داده می‌شه تا عیب‌یابی ممکن باشه
      console.error('profiles query failed', error);
      $('content-area').innerHTML = `<div class="empty-state">خواندن پروفایل از سرور ناموفق بود. (کد خطا: ${esc(error.code || error.status || 'نامشخص')})</div>`;
      return;
    }
    if (!profile) {
      $('content-area').innerHTML = '<div class="empty-state">پروفایلی برای این حساب تعریف نشده است. با مدیر سیستم تماس بگیرید.</div>';
      return;
    }

    state.profile = profile;
    state.viewerRole = profile.role;
    // برای اپراتور، سرگروه مستقیمش هم خوانده می‌شه (برای «گروه ... · سرگروه: ...» در هدر).
    // اگه RLS اجازه‌ی خوندن پروفایل سرگروه رو نده، فقط این خط خالی می‌مونه.
    let manager = null;
    if (profile.role === 'operator' && profile.reports_to) {
      const { data: mgr } = await sb.from('profiles').select('id, full_name').eq('id', profile.reports_to).maybeSingle();
      manager = mgr || null;
    }

    renderTopbar(profile, manager);
    $('period-label').textContent = `دوره‌ی جاری: ${CURRENT_PERIOD.label}`;
    loadSyncStatus().then((ts) => { lastSyncedAt = ts; });

    if (SEES_ALL_ROLES.includes(profile.role)) centerLogin = ensureCenterSession();
    renderUnitSwitcher(profile);
    if (profile.role === 'supervisor' && profile.unit === 'center') { renderCenterOnlyNotice(); return; }
    if (profile.role === 'operator') await renderOperatorView(profile);
    else await renderManagerialView(profile);
    startAutoRefresh();
  }

  // انتخاب‌گر واحد (ازکی سلر | ازکی سنتر) برای منیجر و سرپرست ارشد
  function renderUnitSwitcher(profile) {
    if (!SEES_ALL_ROLES.includes(profile.role)) return;
    const centerUrl = cfg.CENTER_URL || '';
    const el = document.createElement('nav');
    el.className = 'unit-switch';
    el.setAttribute('aria-label', 'انتخاب واحد');
    el.innerHTML = `
      <span class="unit-opt active" aria-current="page">ازکی سلر</span>
      ${centerUrl
        ? `<a class="unit-opt" href="${esc(centerUrl)}">ازکی سنتر</a>`
        : '<span class="unit-opt disabled" title="داشبورد ازکی سنتر هنوز منتشر نشده است">ازکی سنتر <small>به‌زودی</small></span>'}`;
    document.querySelector('.topbar-left').appendChild(el);
    if (centerUrl) { // پیش‌بارگذاری صفحه‌ی ازکی سنتر برای جابه‌جایی سریع
      const pre = document.createElement('link');
      pre.rel = 'prefetch'; pre.href = centerUrl;
      document.head.appendChild(pre);
    }
    const link = el.querySelector('a.unit-opt');
    if (link) link.addEventListener('click', async (e) => {
      if (!centerLogin) return;
      e.preventDefault();
      await centerLogin;
      location.href = link.href;
    });
  }
  // سرپرست واحد ازکی سنتر: داده‌ای از ازکی سلر ندارد
  function renderCenterOnlyNotice() {
    const centerUrl = cfg.CENTER_URL || '';
    $('period-label').textContent = '';
    $('summary-row').innerHTML = '';
    $('content-area').innerHTML = `
      <div class="panel center-notice">
        <div class="center-notice-title">شما سرپرست واحد ازکی سنتر هستید</div>
        <p>داده‌های این صفحه مربوط به واحد صدور ثالث ازکی سلر است. داشبورد واحد شما جداست.</p>
        ${centerUrl ? `<a class="primary center-link" href="${esc(centerUrl)}">ورود به داشبورد ازکی سنتر</a>` : '<p class="muted">لینک داشبورد ازکی سنتر به‌زودی اینجا قرار می‌گیرد.</p>'}
      </div>`;
  }

  function renderTopbar(profile, manager) {
    $('user-name').textContent = profile.full_name || '—';
    $('user-role').textContent = ROLE_LABELS[profile.role] || profile.role;
    $('user-avatar').textContent = (profile.full_name || '?').trim().charAt(0);
    let groupInfo = '';
    if (manager && manager.full_name) {
      const groupLabel = getGroupLabel(manager.full_name);
      groupInfo = groupLabel ? `${groupLabel} · سرگروه: ${manager.full_name}` : `سرگروه: ${manager.full_name}`;
    }
    $('user-group-info').textContent = groupInfo;
  }

  let lastSyncedAt = null;
  async function loadSyncStatus() {
    const { data } = await sb.from('sync_status').select('last_synced_at').eq('id', 1).maybeSingle();
    const note = $('sync-note');
    note.textContent = (data && data.last_synced_at)
      ? `آخرین به‌روزرسانی: ${new Date(data.last_synced_at).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })}`
      : '';
    return (data && data.last_synced_at) || null;
  }

  // --- تازه‌سازی خودکار: هر ۲ دقیقه (و وقتی تب دوباره فعال می‌شود) اگر ورک‌فلو داده‌ی تازه نوشته باشد،
  // صفحه بدون پرش دوباره ساخته می‌شود؛ ردیف‌های باز، جستجو، فیلتر و اسکرول حفظ می‌شوند.
  const REFRESH_MS = 2 * 60 * 1000;
  let refreshing = false;
  async function checkForUpdate() {
    if (refreshing || document.hidden || !state.profile) return;
    const t = getTodayJalali();
    if (t[0] * 10000 + t[1] * 100 + t[2] !== TODAY_SORT) { location.reload(); return; } // روز عوض شده
    refreshing = true;
    try {
      const ts = await loadSyncStatus();
      if (ts && ts !== lastSyncedAt) {
        lastSyncedAt = ts;
        await refreshView();
      }
    } catch (e) {
      console.error('auto refresh failed', e);
    } finally {
      refreshing = false;
    }
  }
  async function refreshView() {
    const scrollY = window.scrollY;
    window.__revealInstant = true; // موشن ورود در به‌روزرسانی خودکار اجرا نشود
    try { await refreshViewInner(); } finally { setTimeout(() => { window.__revealInstant = false; }, 0); }
    window.scrollTo(0, scrollY);
  }
  async function refreshViewInner() {
    if (state.profile.role === 'operator') {
      const monthOpen = !!document.querySelector('#month-card-detail.open');
      await renderOperatorView(state.profile, { keepMonthOpen: monthOpen });
    } else {
      const openIds = [...document.querySelectorAll('#tree-root .tree-row.open')].map((r) => r.getAttribute('data-id'));
      const search = state.search, companyFilter = state.companyFilter;
      await renderManagerialView(state.profile, { silent: true });
      state.search = search; state.companyFilter = companyFilter;
      if (search) $('tree-search').value = search;
      if (companyFilter && $('company-filter')) $('company-filter').value = companyFilter;
      if (search || companyFilter) updateTreeFilter();
      openIds.forEach((id) => {
        const row = document.querySelector(`#tree-root .tree-row[data-id="${CSS.escape(id)}"]`);
        if (row && !row.classList.contains('open')) toggleRow(row);
      });
    }
  }
  function startAutoRefresh() {
    setInterval(checkForUpdate, REFRESH_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
  }

  // ---------------------------------------------------------------
  // نمای اپراتور
  // ---------------------------------------------------------------
  async function renderOperatorView(profile, { keepMonthOpen = false } = {}) {
    const [{ data, error }, { data: ownStatus, error: statusError }, { data: scopeRows }, { data: companyRows }, { data: rankRows }] = await Promise.all([
      sb.from('daily_targets')
        .select('report_date_jalali, report_date_sort, target_count, daily_salary, transfer_count, non_transfer_count')
        .eq('operator_id', profile.id)
        .gte('report_date_sort', CURRENT_PERIOD.startSort)
        .lte('report_date_sort', CURRENT_PERIOD.endSort)
        .order('report_date_sort', { ascending: false })
        .limit(RECENT_DAYS_LIMIT),
      // «*» تا اگه ستونی مثل updated_at توی جدول نبود، کل کوئری خطا نده؛ RLS فقط ردیف خودش رو برمی‌گردونه
      sb.from('issuer_active_status')
        .select('*')
        .eq('operator_id', profile.id)
        .maybeSingle(),
      // شرکت‌های گروهِ سرگروه (RLS: فقط ردیف‌های سرگروه مستقیم خود کاربر)
      profile.reports_to
        ? sb.from('team_lead_company_scope').select('company, sort_order').eq('profile_id', profile.reports_to).order('sort_order')
        : Promise.resolve({ data: null }),
      // صدور ماه به تفکیک شرکت (RLS: فقط ردیف‌های خود کاربر)
      sb.from('daily_company_targets')
        .select('company, issue_count')
        .eq('operator_id', profile.id)
        .gte('report_date_sort', CURRENT_PERIOD.startSort)
        .lte('report_date_sort', CURRENT_PERIOD.endSort)
        .limit(5000),
      // رتبه‌ی امروز در تیم سرگروه (تابع امن: فقط رتبه‌ی خودم و تعداد اعضای تیم)
      sb.rpc('my_today_rank', { p_date_sort: String(TODAY_SORT) }),
    ]);
    const rank = Array.isArray(rankRows) ? rankRows[0] : rankRows;
    const groupCompanies = (scopeRows || []).map((r) => (r.company || '').trim()).filter(Boolean);

    if (statusError) console.error('issuer_active_status query failed', statusError);
    renderOperatorStatusBadges(ownStatus);
    const content = $('content-area');

    if (error) {
      content.innerHTML = '<div class="empty-state">خطا در دریافت اطلاعات. صفحه را دوباره بارگذاری کنید.</div>';
      return;
    }

    const rows = (data || []).slice()
      .sort((a, b) => (Number(b.report_date_sort) || 0) - (Number(a.report_date_sort) || 0));
    const total = rows.reduce((s, r) => s + (Number(r.target_count) || 0), 0);
    const totalSalary = rows.reduce((s, r) => s + (Number(r.daily_salary) || 0), 0);
    const last = rows[0]; // آخرین رکورد ثبت‌شده (نه لزوماً امروز)
    const todayCount = rows
      .filter((r) => Number(r.report_date_sort) === TODAY_SORT)
      .reduce((s, r) => s + (Number(r.target_count) || 0), 0);

    $('summary-row').innerHTML = `
      <div class="summary-card"><div class="label">جمع کل حقوق <span class="unit">(ریال)</span></div><div class="value salary">${formatNum(totalSalary)}</div></div>
      <div class="summary-card"><div class="label">جمع کل ثبت‌شده</div><div class="value">${formatNum(total)}</div></div>
      <div class="summary-card"><div class="label">صدور امروز</div><div class="value">${formatNum(todayCount)}</div></div>
      <div class="summary-card"><div class="label">روزهای فعالیت</div><div class="value">${formatNum(rows.length)}</div></div>
      <div class="summary-card"><div class="label">آخرین روز فعالیت</div><div class="value date">${last ? esc(faDigits(last.report_date_jalali)) : '—'}</div></div>
      ${renderRankCard(rank)}
    `;

    bindShareDonutHover();
    const topHtml = (groupCompanies.length
      ? renderGroupCompanies(ownStatus, groupCompanies)
      : renderCompaniesRow(ownStatus) + renderCompanyDonut(ownStatus))
      + sharePairHtml(renderCompanyShareDonut(companyRows), renderTransferShareDonut(rows));

    if (rows.length === 0) {
      content.innerHTML = topHtml + '<div class="panel"><div class="empty-state">هنوز رکوردی برای شما ثبت نشده است</div></div>';
      return;
    }

    const asc = sortAsc(rows);
    const series = dailySeries(rows);
    content.innerHTML = topHtml + renderDailyTrendChart(series) + `
      <div class="tree-node">
        <div class="tree-row role-team_lead" id="month-card-toggle" tabindex="0" role="button" aria-expanded="false">
          <span class="chevron">◀</span>
          <span class="name">${esc(CURRENT_PERIOD.label)}</span>
          <span class="spacer"></span>
          <span class="tree-count">${formatNum(rows.length)} روز فعالیت</span>
        </div>
        <div class="tree-children" id="month-card-detail">
          <div class="tree-children-inner">${rowsTableHtml(asc, 'حقوق روز (ریال)')}</div>
        </div>
      </div>
    `;

    bindTrendChart(series);

    const toggle = $('month-card-toggle');
    const detail = $('month-card-detail');
    const flip = () => {
      const open = !detail.classList.contains('open');
      toggle.classList.toggle('open', open);
      detail.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', String(open));
    };
    toggle.addEventListener('click', flip);
    toggle.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    if (keepMonthOpen) flip();
  }

  // کارت «رتبه‌ی امروز در تیم»: «۵ از ۳۶»؛ نفرات ۱ تا ۳ (با صدور بیشتر از صفر) مدال طلا/نقره/برنز می‌گیرند
  const MEDALS = {
    1: { cls: 'gold', label: 'مدال طلا' },
    2: { cls: 'silver', label: 'مدال نقره' },
    3: { cls: 'bronze', label: 'مدال برنز' },
  };
  function medalSvg(n) {
    const m = MEDALS[n];
    return `<svg class="medal ${m.cls}" viewBox="0 0 32 40" role="img" aria-label="${m.label}">
      <path class="ribbon-l" d="M8 0h7l-4 15H4z"/><path class="ribbon-r" d="M17 0h7l4 15h-7z"/>
      <circle class="disc" cx="16" cy="25" r="12"/><circle class="ring" cx="16" cy="25" r="8.5"/>
      <text x="16" y="29.5" text-anchor="middle">${n}</text></svg>`;
  }
  function renderRankCard(rank) {
    if (!rank || !rank.team_size) return '';
    const r = Number(rank.team_rank), size = Number(rank.team_size), mine = Number(rank.today_count) || 0;
    const medal = (mine > 0 && r <= 3) ? medalSvg(r) : '';
    return `
      <div class="summary-card rank-card ${medal ? 'has-medal' : ''}" title="رتبه بر اساس تعداد صدور امروز در تیم سرگروه شما">
        <div class="label">رتبه‌ی امروز در تیم</div>
        <div class="value">${medal}<span>${formatNum(r)} <small>از ${formatNum(size)}</small></span></div>
      </div>`;
  }

  function rowsTableHtml(rows, salaryHeader = 'حقوق روز') {
    return `
      <table class="rows">
        <thead><tr><th>تاریخ</th><th class="num">عملکرد</th><th class="num">${salaryHeader}</th></tr></thead>
        <tbody>
        ${rows.map((r, i) => `
          <tr style="--i:${i}">
            <td class="date">${esc(faDigits(r.report_date_jalali))}</td>
            <td class="num"><span class="pill">${r.target_count != null ? formatNum(r.target_count) : '—'}</span></td>
            <td class="num"><span class="pill salary">${r.daily_salary != null ? formatNum(r.daily_salary) : '—'}</span></td>
          </tr>
        `).join('')}
        </tbody>
      </table>
    `;
  }


  function renderOperatorStatusBadges(status) {
    const box = $('operator-status-badges');
    if (!status) { box.innerHTML = ''; return; }
    const adminOn = status.is_active === true;
    const selfOn = status.is_active_to_issue === true;
    box.innerHTML = `
      <span class="status-pill ${adminOn ? '' : 'off'}"><span class="status-dot ${adminOn ? '' : 'inactive'}"></span>${adminOn ? 'فعال' : 'غیرفعال'}</span>
      <span class="status-pill ${selfOn ? '' : 'off'}"><span class="status-dot ${selfOn ? '' : 'inactive'}"></span>${selfOn ? 'آنلاین' : 'آفلاین'}</span>
    `;
  }

  function renderCompaniesRow(status) {
    if (!status) return '';
    const names = splitCompanies(status.companies);
    // اگه الان در هیچ شرکتی فعال نیست ولی قبلاً بوده، پنل خالی نمی‌مونه
    if (names.length === 0 && splitCompanies(status.all_companies).length === 0) return '';
    return `
      <div class="panel companies">
        <div class="label">شرکت‌های فعال</div>
        <div class="names">${names.length ? names.map(esc).join('،  ') : 'در حال حاضر در هیچ شرکتی فعال نیستید'}</div>
      </div>
    `;
  }

  // نمودار دونات: چند شرکت از کل شرکت‌هایی که اپراتور تا حالا باهاشون کار کرده، الان فعاله
  // (تارگت‌ها به‌تفکیک شرکت ثبت نمی‌شن، پس مبنا وضعیت فعال/غیرفعال شرکت‌هاست، نه تعداد صدور هر شرکت)
  // شرکت‌های گروه (از team_lead_company_scope) در مقابل شرکت‌هایی که اپراتور الان در آن‌ها فعال است:
  // دونات = چند شرکت از شرکت‌های گروه فعال است؛ زیرش همه‌ی شرکت‌های گروه، فعال‌ها پررنگ.
  function renderGroupCompanies(status, group, title) {
    const active = new Set(splitCompanies(status && status.companies));
    const activeInGroup = group.filter((c) => active.has(c));
    const outside = [...active].filter((c) => !group.includes(c));
    const pct = Math.round((activeInGroup.length / group.length) * 100);
    const updated = status && status.updated_at
      ? new Date(status.updated_at).toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })
      : '—';
    return `
      <div class="panel chart donut-panel group-panel">
        <div class="label">${esc(title || 'شرکت‌های فعال شما از شرکت‌های گروه')}</div>
        <div class="donut-wrap group">
          <div class="donut" style="--pct:${pct}" role="img" aria-label="${pct} درصد از شرکت‌های گروه فعال">
            <div class="donut-hole"><b>${formatNum(pct)}٪</b><small>${formatNum(activeInGroup.length)} از ${formatNum(group.length)}</small></div>
          </div>
          <div class="donut-info">
            <div class="company-chips">
              ${group.map((c) => `<span class="company-chip ${active.has(c) ? 'on' : ''}">${active.has(c) ? '<span class="chk">✓ </span>' : ''}${esc(c)}</span>`).join('')}
            </div>
            ${outside.length ? `
              <div class="outside">
                <div class="label">فعال در شرکت‌های خارج از گروه:</div>
                <div class="company-chips">${outside.map((c) => `<span class="company-chip extra">${esc(c)}</span>`).join('')}</div>
              </div>` : ''}
            <div class="updated">آخرین به‌روزرسانی: ${esc(updated)}</div>
          </div>
        </div>
      </div>
    `;
  }

  // سهم هر شرکت از صدورهای ماه (دونات چندتکه). ۵ شرکت اول به ترتیب سهم، از آبی پررنگ تا آسمانی؛ بقیه «سایر» (خاکستری).
  const SHARE_SLOTS = 5;
  function renderCompanyShareDonut(rows) {
    const byCompany = {};
    (rows || []).forEach((r) => {
      const c = (r.company || '').trim();
      const n = Number(r.issue_count) || 0;
      if (c && n > 0) byCompany[c] = (byCompany[c] || 0) + n;
    });
    let items = Object.entries(byCompany).map(([company, count]) => ({ company, count }))
      .sort((a, b) => b.count - a.count || a.company.localeCompare(b.company, 'fa'));
    const total = items.reduce((s, x) => s + x.count, 0);
    if (!total) return '';
    if (items.length > SHARE_SLOTS) { // فقط ۵ رنگ داریم؛ از ۶ شرکت به بعد بقیه در «سایر»
      const rest = items.slice(SHARE_SLOTS);
      items = items.slice(0, SHARE_SLOTS).concat([{ company: 'سایر', count: rest.reduce((s, x) => s + x.count, 0), other: true }]);
    }
    items.forEach((x, i) => {
      x.pct = (x.count / total) * 100;
      x.color = x.other ? 'var(--cat-other)' : `var(--cat-${i + 1})`;
    });
    return sharePanelHtml({
      title: `سهم شرکت‌ها از صدورهای ${CURRENT_PERIOD.label || 'این ماه'}`,
      items, total, nameHeader: 'شرکت', aria: `سهم شرکت‌ها از ${formatNum(total)} صدور`,
    });
  }

  // دو دونات کنار هم (سهم شرکت‌ها | فراوانی سفارشات)؛ اگه فقط یکی داده داشت، تمام‌عرض
  function sharePairHtml(a, b) {
    const parts = [a, b].filter(Boolean);
    if (parts.length < 2) return parts.join('');
    return `<div class="share-pair">${parts.join('')}</div>`;
  }

  // «فراوانی سفارشات»: سهم صدورهای انتقالی و غیرانتقالی اپراتور در دوره‌ی جاری
  function renderTransferShareDonut(rows) {
    let transfer = 0, nonTransfer = 0;
    (rows || []).forEach((r) => {
      transfer += Number(r.transfer_count) || 0;
      nonTransfer += Number(r.non_transfer_count) || 0;
    });
    const total = transfer + nonTransfer;
    if (!total) return '';
    const items = [
      { company: 'انتقالی', count: transfer, color: 'var(--cat-1)' },
      { company: 'غیر انتقالی', count: nonTransfer, color: 'var(--cat-2)' },
    ].filter((x) => x.count > 0);
    items.forEach((x) => { x.pct = (x.count / total) * 100; });
    return sharePanelHtml({
      title: 'فراوانی سفارشات', items, total, nameHeader: 'نوع سفارش',
      aria: `سهم سفارش‌های انتقالی و غیرانتقالی از ${formatNum(total)} صدور`,
    });
  }

  // پنل دونات + جدول (مشترک بین «سهم شرکت‌ها» و «فراوانی سفارشات»)
  function sharePanelHtml({ title, items, total, nameHeader, aria }) {
    // حلقه با SVG: هر شرکت یک کمان، با فاصله‌ی ۲ پیکسلی بین کمان‌ها
