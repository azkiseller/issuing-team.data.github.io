name: Notify mirror repo

on:
  push:
    branches: [main]
  workflow_dispatch: # اجرای دستی برای تست، از تب Actions

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in azkicenter/azkiseller
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret SYNC_TOKEN تعریف نشده (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azkicenter/azkiseller/dispatches \
            -d '{"event_type":"upstream-push"}'
          echo "Sync requested for azkicenter/azkiseller"
